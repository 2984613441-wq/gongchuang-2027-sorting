-\n\n## 0. 你的角色\n\n你是**视觉链路**方向的分析者。工作区：`C:\\Users\\29845\\Desktop\\工创赛`（Windows）。\n\n## 1. 问题（用户 2026-09-21 现场原话，含补充量化）\n\n> 「它这个识别，**就算它大部分在这里面，但是问题是它只要有一小部分不在这个识别框里面，它就识别不到**，所以说这个也是需要修的。」\n\n**用户后补的量化（很重要）**：\n\n> 「这个视觉模型的边界识别问题是，**当这个物体它只有大概 1/3 在外面的时候，它这个模型就识别不到这个物体了**。」\n\n**⇒ 量化的现象**：\n* 物块**约 1/3 出画面** ⇒ **完全识别不到**（不是\"识别到了但位置不准\"，是**整个目标消失**）；\n* 期望：物块**大部分在画面内**就应该能识别到（至少给出可用的中心坐标，让树莓派侧的门禁去决定收不收）。\n\n⚠️ 注意这个阈值不是 100%：如果\"必须 100% 在画面内才识别\"，那 1/3 出画时早就该丢了。\n**\"约 1/3 出画是个坎\"这个特征本身，就是定位根因的最强线索** —— 请在分析里解释\n**为什么恰好是这个量级**（例如：检测框被裁掉后宽高比越界？面积阈值？ROI 内有效像素不足？）。\n\n## 2. 你要先做的事（必读，自己用工具读）\n\n- `视觉/src/maixcam_deploy/main.py`（MaixCAM 端主程序；重点看 ROI / 裁剪 / 检测后过滤）\n- `视觉/src/maixcam_deploy/stage1_color_v6_send.py`（颜色分类 + 打包发送；`COLOR_TO_MATERIAL` 在 `:193-197`）\n- `视觉/src/maixcam_deploy/capture.py`\n- `视觉/src/sorting_vision/`（纯逻辑核心：`color_quant` / `sort_plan` / `drop_table` / `pipeline`）\n- `电控/src/electrical_control/rpi/pixel_to_device.py`（重点 `:76-77` 像素门禁、`:360-366`、`:480-508` 工作区校验）\n- `电控/src/electrical_control/rpi/vision_ingest.py`（`:231-236` 落点原样下发）\n- `当前进度与交接.md`（只读；查\"识别区/视场/门禁\"相关章节）\n\n## 3. 已核实的前提（可直接用，不必重新推导）\n\n1. **视场约 155.4 × 155.4 mm**（320px × 0.4855 mm/px）。\n2. **像素门禁已改**为整帧 `(15, 305) × (15, 305)`（`pixel_to_device.py:76-77`，已部署到树莓派）。\n   改之前是 `(60,240)×(85,270)`，实测导致\"两个物块都被拒掉\"。\n3. 真正的安全网是**最终 PICK 的工作区校验**（`pixel_to_device.py:480-494`）。\n4. **线格式每目标只有 7 字节**，**bbox 的 w/h 被丢弃**\n   （`视觉/src/maixcam_deploy/main.py:342-368`）—— 这是关键约束：\n   **相机端根本不知道物块有没有被画面切边**，因为宽高不发。\n5. 实机日志里出现过**大量越界拒识**（一轮 163 次），坐标离谱，例如\n   `pixel_to_device=(1136, -703)`、`(309, -930)`——**x=1136 远超 320 的画幅**。\n   ⇒ 说明视觉端送出的像素值本身就可能**不在 [0,320) 内**。这条**未被查过**。\n\n## 4. 你要回答/产出的\n\n1. **根因分析（要排序）**：物块\"部分出画\"就识别不到，到底卡在哪一环？至少排查：\n   - 相机端 ROI / 裁剪是否把边缘切掉 → 检测框被截断 → 后处理过滤掉；\n   - 相机端是否对\"贴边/超出画面\"的目标做了丢弃；\n   - 打包发送前是否对像素值做了钳制或丢弃；\n   - 树莓派侧像素门禁 `(15,305)` 是否仍在误杀（注意：门禁**只对中心点**判定，\n     所以\"中心在门禁内、但物块一半出画\"这种情况门禁是放行的 ⇒ **问题多半在相机端**）；\n   - 上面第 3 节第 5 条的\"离谱像素值\"是不是同一个根因。\n2. **改法**（至 否等价于\"我已进入 WAIT_TASK、可以接下一件\"？\n4. **正确的派发时序应该是什么？** 给出：链应该在什么条件下才允许派下一件\n   （等 `BARRIER_READY`？等某个 ACK？还是保持现在的\"先发、被拒再退避重试\"更好？）。\n   要给出两种方案的**取舍**（延迟、鲁棒性、误判风险）。\n5. **0.3 s 退避够不够？** 依据是什么？（可以从板子完成一件后到发出 `BARRIER_READY` 的实测间隔推断）\n\n## 3. 必读文件\n\n- `电控/deploy/run_chain.py`\n  （主循环入站事件处理；搜 `event ==` / `startswith(\"NACK\")` / `BARRIER_READY` / `resend_item_task`）\n- `电控/src/electrical_control/rpi/gateway.py`（`:198-228` 把板子应答解析成事件名）\n- `电控/src/electrical_control/protocol/types.py`（`:20` `ACK=0x05`）、`protocol/ack_nack.py`（`:16-19` reason 码）\n- `电控/stm32_logic/src/ec_state_machine.c`（**重点**；搜 `SINGLE_TASK`、`NACK`、`WAIT_TASK`、`BARRIER_READY`）\n- `电控/stm32_logic/src/ec_protocol_gateway.c`（`:66-110` 入站分发）\n- `电控/firmware/stm32f407_m144z/App/Src/ec_app.c`（任务受理路径）\n- `docs/design/interface-contract.md`（V0.8 命令字权威）\n\n## 4. 已核实的前提\n\n* 板子**每完成一件会再报一次 `BARRIER_READY`**（`ec_state_machine.c` 的 `PREPARE_BARRIER` 路径）。\n* **建轮次**那一发 `ITEM_TASK` 会被启动序列**吞掉**（**一个字节都不回**），\n  链的补偿逻辑是在收到 `BARRIER_READY` 时**立刻原样重发**同一帧\n  （`run_chain.py` 里搜 `_should_resend_on_barrier_ready`）。\n* 板子开机处于 `FAULT_LOCK`，`round_id=0`；**收到第一发 `ITEM_TASK` 才开始建轮次**。\n* **FAULT_LOCK 会自愈**：`ec_state_machine.c` 里\"FAULT_LOCK 下再收到一帧就重建轮次继续\"，\n  注释原文\"一次故障之后链路能自愈，不必人工按 RESET\"。\n  ⚠️ 这条有个危险推论：**超窗后主机每几秒一次的在飞重传，会让机器从「错误原点」重跑同一件。**\n  也请一并确认这条推论是否成立。\n* 单件程序 **10 步**；程序跑完才发**一次** `MOTION_DONE`。\n* 15 秒失活窗：**只有 `DISPLAY_ACK` 能关窗**，运动进度不算（`App/Inc/ec_app.h:16-17` 进度源编译期关闭）。\n\n## 5. 产出要求\n\n1. **根因结论**（带 `文件:行号`）。\n2. **推荐的派发时序**（写成可落地的伪代码/diff 片段；说明改哪几行）。\n3. **是否建议回退今晚那个 0.3 s 退避补丁**（如果正向信号方案更好）。\n4. **是否需要改协议**（如需要，明确标 L4 并说明为什么无法用现有命令字解决）。\n5. **验收判据**：能一条命令/一段日志判定的那种。建议判据示例：\n   「连跑 ≥6 件，`NACK_*` 计数 = 0，且每件 `ITEM_TASK → DISPLAY_ACK` ≤ 14.0 s」。\n\n## 6. 硬性要求\n\n- 每条结论带 `文件:行号`；无法证实的写「未验证」，**不要猜**。\n- 证据分三档：**【实测】/【代码推断】/【未验证】**。\n- 结尾给：\n\n```\n[落点] 目标文件：<路径> ｜ 方式：新建/修改 ｜ 语言：<语言>\n[建议执行] <可执行命令清单>\n```\n"}, {"file": "03-T3-标定-XY行程与落点操作卡.md", "button": "03 T3 标定操作卡", "who": "Claude", "attach": "", "task": "给朋友的操作卡：量 X/Y 实际行程 + 落点标定 SOP", "text": "# T3 · 标定：X/Y 实际行程测量操作卡 + 落点标定 SOP\n\n> **整份复制给 AI 即可。**\n> **你是只读分析者：不要创建/修改/删除任何文件，不要执行 git，不要连硬件、不要上电、不要烧录。**\n> 方案写在回复里，**不要落盘**。\n\n---\n\n## 0. 你的角色\n\n你是**现场标定流程**方向的分析者。工作区：`C:\\Users\\29845\\Desktop\\工创赛`。\n\n## 1. 背景（非常重要，先读懂再写）\n\n**2026-09-21 凌晨出过一次事故**：\n\n* 用\"发步数 + 数脉冲\"的方法去推 X/Y 行程，累计发出 Y 共 **24920 步 ÷ 80 步/mm = 311.5 mm**，\n  而 **Y 丝杆只有 29 cm** ⇒ 算术上不可能。\n* 原因：**开环步进**。滑台早就顶死了，电机继续空转丢步，而\n  **`STEP_RESULT=1` 只证明\"脉冲发完了\"，不证明\"滑台到位了\"**。\n* 更糟：顶死堵转导致**电流拉高 → 供电跌落 → STM32 欠压重启**（实测 `MOVES=0`、`TICK_MS` 归零）。\n\n**⇒ 结论：不能再靠\"发命令 + 数脉冲\"测行程。必须实测。**\n\n## 2. 🔴 行程口径 —— **已由用户 2026-09-21 实测定案，不要再猜**\n\n> 用户原话：「这个行程是**有夹爪之后**的行程；**没有夹爪，它的行程就不止这一点点了**。\n> 如果不考虑夹爪的物理阻挡，它 **X、Y 轴都是 29 cm**。」\n\n**⇒ 两个数不是一回事：**\n\n| | 值 | 含义 |\n|---|---|---|\n| **滑台机械行程** | **X = 29 cm、Y = 29 cm** | **不装夹爪**时的理论行程 |\n| **装夹爪后可用行程** | **X = 18.0 cm、Y = 18.5 cm** | 夹爪会撞到东西 ⇒ **链真正能用的** |\n\n**换算到滑台坐标**（运动原点 = HOME = 滑台 `(−95.0, −97.5)`）：\n\n```\n机械行程 29cm     ⇒ 滑台理论能到  X = −95.0 + 290 = +195.0、Y = −97.5 + 290 = +192.5\n夹爪安全线 18/18.5 ⇒ 滑台只能到    X = −95.0 + 180 = +85.0\n                                   Y = −97.5 + 185 = +87.5\n```\n\n🔴 **固件现在放行到 `X = +90.0`、`Y = +92.5`**（`App/Inc/ec_motion_plan.h:126-127`）\n⇒ **比夹爪安全线还远 5 mm ⇒ 会超程顶死 ⇒ 丢步 ⇒ 坐标基准漂移。**\n（历史事故见上一节：顶死 → 堵转 → 欠压重启 → 坐标基准全废。）\n⇒ **这条要收紧，不是放宽。**\n\n**⇒ 落点允许范围（滑台坐标）**：`x ∈ [−95.0, +85.0]`、`y ∈ [−97.5, +87.5]`\n**⇒ 当前落点 `(14.5, 19.0)`**：距 HOME 只有 **10.95 / 11.65 cm**，**远在安全区内**。\n\n⚠️ **作废的旧口径**（不要再引用）：\n* ~~\"X 净行程 22 cm / Y 净行程 24 cm（29 − 夹爪 7/5）\"~~ —— 已被上面的实测取代；\n* ~~\"Y 走到 28.15 cm 处才顶死\"~~ —— 那是**开环丢步**造成的假象，不是真实行程。\n\n**⇒ 固件里写的可达域只有 19.0 cm**（`EC_MOTION_REACH_LIMIT/FAR_Y_MM10 = 975 / 925`）\n⇒ **如果机械真有 22~28 cm，固件白白砍掉了 3~9 cm。**\n\n## 3. 你这次是给「用户的朋友」写操作卡\n\n朋友**明天在电脑前**（通过 SSH 连树莓派 `pi@172.20.10.8`）执行。他**不懂这个项目**。\n\n**操作卡要求**：\n\n1. **一步一步，每步一条命令**，可以直接复制粘贴。\n2. 每步写清**\"应该看到什么\"**（判据），以及**\"看到别的怎么办\"**。\n3. **明确禁止**任何会导致顶死/丢步的做法（这是本次事故的根源）。\n4. 要能覆盖：**X 净行程**、**Y 净行程**，**各自在什么条件下测**（因为怀疑\"Y 能走多远取决于 X 停在哪\"——\n   实测发现 X 在 HOME 时 Y 到 26cm 前就顶死，而 X 在工作位时能到 28.15cm）。\n5. 必须包含**测量前后的原点纪律**：\n   **断电 → 手推 X/Y 到最里角顶住 → 上电/复位 → 复位后不再手动移滑台**。\n6. 必须包含**怎么判断\"已经到尽头了\"**（判据不能是 `STEP_RESULT` —— 见 §1）。\n\n## 4. 还要产出：落点标定 SOP\n\n**用户已确认的落点形态**（2026-09-21）：\n\n> 「转盘直接**固定 3 个落点**，然后**转 180° 到另一侧另外 3 个落点**。」\n> 6 个货格分两组、每组 3 个，两组在转盘上相差 180°；夹爪只在**每组的 3 个固定落点**之间移动。\n> **3 个落点的具体坐标「先待定」，用户之后提供。**\n\n⇒ SOP 要能**吃进 3 个坐标**，产出：\n* `[DropPoints]` 的 6 行（box 4/5/6 复用 box 1/2/3 的坐标 + 注明\"需转盘在 B 侧\"）；\n* 固件可达范围是否需要放宽（`EC_MOTION_REACH_FAR_X/Y_MM10`）、放到多少；\n* `EC_STEP_MAX_STEPS`（现 16000 步 = 200mm）够不够；\n* 同步 `calibration_config.ini` 的 `[WorkspaceLimits]`。\n\n⚠️ **注意坐标系陷阱**（今晚查清的）：\n* MS 侧配置的是**滑台记账坐标**，**原样下发**、**不叠加 ToolOffset**\n  （`电控/src/electrical_control/rpi/vision_ingest.py:231-236`）；\n* 夹爪**物理位置 = 滑台坐标 + (120.5, 43.5)**（`/home/pi/电控/calibration_config.ini:134-135`）；\n* HOME（最里角）滑台坐标 = `(−95.0, −97.5)`。\n  ⇒ 用户说的\"距最里角 X 23cm / Y 16cm\"对应的**滑台坐标 = 23cm − 12.05cm = 10.95cm**，\n  即 `(14.5, 19.0)` mm（这正是现在链里跑的值）。\n\n## 5. 必读文件\n\n- `当前进度与交接.md`（**尤其 §14.13 / §14.14 / §14.15**，还有 §3 装置坐标与可达域、§5 生效参数）\n- `电控/deploy/pi_bench_goto.py`（台架移动脚本；**注意它只数脉冲、不能当到位判据**）\n- `电控/deploy/pi_peek.py`（**只读**读板子：PING/AXIS/STATUS/INPUTS）\n- `电控/deploy/sorting_config.ini`、`/home/pi/sorting_config.ini`（链真正读的是后者，见 `run_chain.py` 的 `DEFAULT_CONFIG_PATH`）\n- `电控/firmware/stm32f407_m144z/App/Inc/ec_motion_plan.h`（`:94/106/126/127/193/194` 可达域与 HOME）\n- `电控/firmware/stm32f407_m144z/App/Inc/ec_step_test.h`（`:24` 步数上限）\n- `docs/交付/2026-09-19/现场测量工单-给现场同事-2026-09-19.md`（**已有工单，可作模板**）\n\n## 6. 硬性要求\n\n- 每条结论带 `文件:行号`；无法证实的写「未验证」。\n- 证据分三档：**【实测】/【代码推断】/【未验证】**。\n- **操作卡要能让一个外行照做**：命令可直接复制、判据明确、失败路径齐全。\n- 结尾给：\n\n```\n[落点] 目标文件：<路径> ｜ 方式：新建/修改 ｜ 语言：<语言>\n[建议执行] <可执行命令清单>\n```\n"}, {"file": "04-T4-机械-3落点与转盘2方向.md", "button": "04 T4 机械/转盘", "who": "Grok", "attach": "", "task": "3 个固定落点 + 转盘只转 2 个方向（0°/180°）", "text": "# T4 · 机械：3 个固定落点 + 转盘只转 2 个方向（0°/180°）\n\n> **整份复制给 AI 即可。**\n> **你是只读分析者：不要创建/修改/删除任何文件，不要执行 git，不要连硬件、不要上电。**\n> 设计写在回复里，**不要落盘**。\n\n---\n\n## 0. 你的角色\n\n你是**机械 + 执行器选型**方向的判断者。工作区：`C:\\Users\\29845\\Desktop\\工创赛`。\n\n## 1. 用户 2026-09-21 的最新方案（原话）\n\n> 「转盘我们想的是**直接固定三个落点**，然后后面**直接转 180° 到另一侧另外三个落点**就可以了。」\n\n**换算成设计语言**：\n\n* 6 个货格 → **分成两组，每组 3 个**；\n* 两组在转盘上**相差 180°**；\n* 夹爪**只在\"每组的 3 个固定落点\"之间移动**（靠滑台 XY，**不靠转盘**）；\n* A 组 3 格分拣完 → **转盘转 180°** → B 组 3 格转到**同样的 3 个位置**上。\n\n⇒ **转盘只需要 2 个角度位置**，不需要 6 个分度。**这是本方案最大的价值。**\n\n## 2. 你必须先确认的一件事（已有一条强推论，请复核）\n\n**执行器**：转盘舵机是**位置舵机**，不是连续旋转型（2026-09-21 实测定案）。\n\n* **行程 ≈ 270°**（脉宽 500–2500 µs），**1500 µs 是正中心**\n* 实测：**脉宽减小 = 顺时针**；90° ≈ 655 µs\n* 盘面「线 0」= **1500 µs**；「线 1」= **845 µs**（用户目视确认）\n* **不可累加**：连发 3 次同一个脉宽，只在第 1 次动（已实测）\n\n**关键推论（请复核是否成立）**：\n\n> 想\"从 1500 向一侧转 180°\"是**做不到**的：1500 ± 180°×(655/90) = 1500 ± 1310 = **190 µs / 2810 µs**，\n> **两头都超出 500–2500**。\n> **但如果把\"两组的分界\"装夹在舵机正中心（1500 µs）**，两组各占 **±90°**\n> ⇒ 对应 **845 µs / 2155 µs** ⇒ **正好 180° 分离，而且两端都落在行程内** ✅\n> **⇒ 现有这只 270° 舵机直接可用，不需要 2:1 增速、不需要换舵机。**\n\n**你要做**：\n1. 复核这条推论（含误差预算：舵机的绝对精度、重复性、传动间隙会让 180° 变成多少？）。\n2. 如果成立，给出**装夹要求**：分界怎么对、怎么标定、怎么验证\"真的是 180°\"。\n3. 如果不成立，给出替代路线（2:1 增速 / 换件 / 步进），并说明代价。\n\n## 3. 还要产出的设计内容\n\n1. **3 个固定落点的几何**：\n   - 3 个点怎么排（一条直线？三角？）、间距多少、离转盘中心多远；\n   - **约束**：落点必须落在**夹爪可达带**内（滑台 X ∈ [−95, +90]、Y ∈ [−97.5, +92.5]，\n     90 步/mm；夹爪物理位置 = 滑台坐标 + (120.5, 43.5)）；\n   - **约束**：件 ≤ 40 mm（赛规），转盘上 3 个格子要装得下。\n2. **转盘尺寸**：\n   - 6 格分两组、每组 3 个、两组相差 180° ⇒ 转盘直径至少多少？（给出算式）\n   - 每组 3 格的角跨度是多少？扇区宽度够不够放 40 mm 的件？\n3. **翻转的代价**：\n   - 每次翻 180° 需要多久？（舵机约 0.17 s/60° @4.8V ⇒ 180° 约 0.5–0.8 s，加整定）\n   - 🔴 **件的顺序是随机的**（可能 2、5、1、6…）。若 A/B 两组交替出现，转盘要**反复翻**。\n     请评估：**同侧批处理**（先在 A 组分完再翻）是否可行？代价是什么？\n     在 15 秒失活窗下，翻转开销能不能接受？\n4. **零位**：位置舵机有绝对反馈 ⇒ 理论上开机即知位置；但**手动拧过输出轴会改变零点**\n   （用户实测断电时输出轴可被手动无限转动，与\"位置舵机\"矛盾，至今未解释）。\n   请给出**开工前的零点自检流程**与判据。\n5. **索引开关还有用吗**：现在装的是 **FC-SPX303Z 槽型对射光电**（`GPIO17`，内部上拉、无外部电阻），\n   已实测能用（空槽读 1，插纸片触发）。在\"只转 2 个位置\"的方案下，它是必需件还是校验件？\n   ⚠️ **槽型对射必须用穿过槽的实体挡片，盘面贴黑胶带完全无效。**\n\n## 4. 必读文件\n\n- `当前进度与交接.md`（**§14.9 / §14.10 / §14.12 / §14.16** 是转盘的核心结论）\n- `docs/design/方案C-转盘方案设计草案-2026-09-20.md`\n- `电控/firmware/stm32f407_m144z/App/Inc/ec_axis_driver.h`（夹爪/舵机常量；**单舵机联动**）\n- `docs/交付/2026-09-19/现场测量工单-给现场同事-2026-09-19.md`\n- `机械/README.md`（**注意：`机械/drawings/` 与 `机械/specs/` 目前是空目录**）\n- `docs/参考/FC-SPX303Z.pdf`（若路径不同自行搜索；槽型光电手册）→ 也可看 `当前进度与交接.md` §14.6(1) 的摘录\n\n## 5. 硬性要求\n\n- 每条结论带 `文件:行号`；无法证实的写「未验证」，**不要猜**。\n- 证据分三档：**【实测】/【代码推断】/【未验证】**。\n- **给机械组的输出要能直接照着做**：尺寸、材料、装配顺序、验收判据。\n- 结尾给：\n\n```\n[落点] 目标文件：<路径> ｜ 方式：新建/修改 ｜ 语言：<语言>\n[建议执行] <可执行命令清单>\n```\n"}, {"file": "05-T5-夹爪-只动两次的行为确认.md", "button": "05 T5 夹爪", "who": "DeepSeek", "attach": "", "task": "「夹爪每件只动两次」是设计还是故障 + 改法", "text": "# T5 · 夹爪：确认「每件只动两次」是设计还是故障 + 给改法\n\n> **整份复制给 AI 即可。**\n> **你是只读分析者：不要创建/修改/删除任何文件，不要执行 git，不要连硬件、不要上电、不要烧录。**\n> 结论/代码写在回复里，**不要落盘**。\n\n---\n\n## 0. 你的角色\n\n你是**固件时序 + 机构行为**方向的分析者。工作区：`C:\\Users\\29845\\Desktop\\工创赛`。\n\n## 1. 用户 2026-09-21 现场观察（原话）\n\n> 「你的夹爪，它**一般只会动两次**，你知道吗？就刚刚，我看每一个基本上只会动两次，**这个也是需要改的**。」\n\n## 2. 我（总控）目前的初步解释 —— **请你独立复核，不要照抄**\n\n固件里**单件程序是 10 步**：\n\n```\n[0] 舵机：张开 + 抬起    （EC_AXIS_GRIPPER_OPEN_US = 800）\n[1] X 轴移动（HOME → PICK）\n[2] Y 轴移动\n[3] WAIT 200 ms（目视停留）\n[4] 舵机：闭合 + 下压（夹住）= 1900\n[5] X 轴移动（PICK → PLACE）\n[6] Y 轴移动\n[7] 舵机：张开 + 抬起（释放）= 800\n[8] X 轴移动（PLACE → HOME）\n[9] Y 轴移动\n```\n\n⇒ **舵机被命令 3 次**（`[0]`、`[4]`、`[7]`）。\n⇒ 但**上一件结束时夹爪已经处于\"张开\"（`[7]`）状态**，所以这一件的 `[0] \"张开\"` 是**空动作**，看不出动。\n⇒ **肉眼只见 2 次**（`[4]` 闭合、`[7]` 张开）。\n\n**我的判断：这是当前设计的必然结果，不是故障。**\n\n## 3. 你要做的\n\n1. **独立核实**上面这段：程序到底几步、舵机步在哪几步、每步的脉宽是多少、\n   哪些步在\"上一件结束后\"是**幂等空动作**。\n   **必须带 `文件:行号`。** 如果我的解释有错，**直接反驳并给出正确版本**。\n2. **判断这是不是真的有问题**：\n   - 如果是设计必然，**那用户想看到 3 次动作，需要改什么**？（几个可选方案 + 代价）\n   - 如果有真 bug（例如某一步根本没执行、或脉宽没下发、或方向反了），**指出来并给证据**。\n3. **特别注意这几条已知的坑**（都要在结论里体现）：\n   - 🔴 **单舵机联动**：一个舵机**同时**决定\"升降\"与\"夹爪开合\"（`ec_axis_driver.h:92-95` 附近）。\n     ⇒ \"张开/闭合\"和\"抬起/下降\"不是两个自由度。\n   - ⚠️ **头文件里对方向的描述自相矛盾**：\n     `ec_motion_plan.h:205-208` 的注释写 `Z down (open) -> Z up (close = grab)`，\n     而 `ec_axis_driver.h` 的宏写 `EC_AXIS_Z_DOWN_US = CLOSE(1900)`、`EC_AXIS_Z_UP_US = OPEN(800)`。\n     **哪个是对的？实机到底是哪个方向？**（这决定\"用户看到的两次动作\"分别是什么）\n   - ⚠️ `EC_AXIS_GRIPPER_OPEN_US` **同时**是 `[0]` 与 `[7]` 两处的脉宽。\n   - ⚠️ `EC_AXIS_GRIPPER_SETTLE_MS = 600`：每个舵机步之后都要等 600 ms 才推进下一步；\n     历史教训是**200 ms 时\"爪子没合拢就启动 XY，把物块撞移位、一件都夹不起来\"**。\n     ⇒ 任何\"把某一舵机步去掉/合并\"的方案都要评估这条。\n4. **推荐方案**（至少 2 个，各写：改哪个文件哪几行、**是否需要改固件重烧**、\n   对**单件耗时**的影响（现在约 13 s，15 秒窗余量很小）、风险、验收判据）。\n   可能的方向（不限于）：\n   - 在 `[0]` 之前插入一次\"闭合再张开\"（让它真的看得见一次动作）；\n   - 把 `[0]` 的\"张开\"改成\"先闭合到某个中间位再张开\"；\n   - 保持不动，只在日志/屏幕上说明\"第 1 次张开是空动作\"；\n   - 或者：用户其实想要的是**别的东西**（那就在「不确定项」里写清楚要问用户什么）。\n\n## 4. 必读文件\n\n- `电控/firmware/stm32f407_m144z/App/Inc/ec_axis_driver.h`（**重点**：`:40-130` 的常量与方向注释、`:180-200` 的步说明）\n- `电控/firmware/stm32f407_m144z/App/Src/ec_axis_driver.c`（步执行器；`:260-320` 分派、`:380-425` 时序）\n- `电控/firmware/stm32f407_m144z/App/Src/ec_motion_plan.c`（**程序构造**，10 步怎么拼出来的）\n- `电控/firmware/stm32f407_m144z/App/Inc/ec_motion_plan.h`（`:205-221` 程序序列的注释）\n- `电控/firmware/stm32f407_m144z/App/Src/ec_diag.c`（台架命令表，可用来单独驱动舵机）\n- `电控/firmware/stm32f407_m144z/App/Src/ec_servo_test.c`（台架脉宽白名单）\n- `当前进度与交接.md`（只读；查\"夹爪\"、\"舵机\"、\"脉宽\"相关章节）\n\n## 5. 已核实的前提\n\n* 张开脉宽 **800 µs**、闭合 **1900 µs**（2026-09-21 最新值，已重编固件、**尚未烧录**）。\n* 台架可用命令：`SERVO PB10 P750 / P800 / P850 / P870 / P900 / P950 / P1000 / P1100 / P1200 / P1300 / P1500 / P1700 / P1900`，\n  以及 `SERVO STOP`。**烧完新固件后可以先在台架上单独驱动舵机确认方向。**\n* 实机证据：2026-09-21 三轮共 23 件成功分拣（8+6+9），**说明\"只动两次\"不影响抓放成功**。\n\n## 6. 硬性要求\n\n- 每条结论带 `文件:行号`；无法证实的写「未验证」，**不要猜**。\n- 证据分三档：**【实测】/【代码推断】/【未验证】**。\n- 如果结论是\"要问用户\"，就把**问用户的原话**写出来（要能让用户一句话回答）。\n- 结尾给：\n\n```\n[落点] 目标文件：<路径> ｜ 方式：新建/修改 ｜ 语言：<语言>\n[建议执行] <可执行命令清单>\n```\n\n---\n\n## 7. 🔴 本轮新增规格（2026-09-21 用户补充，**必须一起考虑**）\n\n> 用户原话：「每次识别到物体，**必须要先判别一次是啥，之后再调整脉宽**（需人工测量）。\n> 这样的话，我们**只用固定三个脉宽（夹爪）**，**减少将其他物体蹦飞**。\n> **等脉宽调整过来后，再进行夹取。**」\n\n**⇒ 这是对你这条任务的最大变更：张开脉宽要\"按件类别选\"，而且只有 3 个值。**\n\n### 你要额外回答的\n\n1. **现在能不能做到\"按类别选张开脉宽\"？** 已知约束：\n   `EC_AXIS_GRIPPER_OPEN_US` 是**编译期常量**；**同时**是 `[0]` 与 `[7]` 两处开度；\n   且**单舵机联动**（一个舵机同时决定升降与开合）。\n   ⇒ 给出实现路径（至少 2 条），每条写清：改哪些文件、**属于\"改固件\"还是\"改协议\"**、\n   **是否触发 L4**、对单件耗时的影响、验收判据。可选（不限于）：\n   - **A**：固件内加 `class_id → 张开脉宽` 的**编译期小表**，`[0]/[7]` 改查表（不改协议，仍需重编重烧）；\n   - **B**：`ITEM_TASK` 加字段携带脉宽/类别（**必然 L4**，动线格式）；\n   - **C**：用台架通道临时驱动（`SERVO PB10 P###` + `SERVO STOP`）——说明能否进主程序；\n   - **D**：其它（你判断）。\n2. **\"3 个脉宽\"怎么分组？** 6 个类别只用 3 个开度 ⇒ 谁和谁共用？\n   给出**分组依据**（按形状？按最大外形？）与所需实测输入。\n   ⚠️ 已知：赛规货物 ≤ 40 mm；`[Gripper] envelope_mm = 25.0, 25.0` 是**【待实测】占位**。\n3. **顺序约束**：用户要求\"**先判类别 → 设脉宽 → 再移动/夹取**\"。\n   现在固件是**固定 10 步**、`[0]` 就是舵机步 ⇒ 说明**当前顺序是否已满足**，还是要改成\"先发脉宽再走 XY\"。\n   **这一条要单独给结论。**\n4. **\"减少蹦飞\"这个目标**靠开度能达成多少？还是主要靠**路径**（用户另一条要求：夹完先向 +Y 出托盘再去落点）？给判断与依据。\n\n### 这一节同样适用三档证据标注 + `文件:行号`\n"}, {"file": "06-T6-性能-屏幕帧打包提速.md", "button": "06 T6 屏幕提速", "who": "ChatGPT", "attach": "", "task": "逐像素打包 → numpy/Pillow，附逐字节 md5 对拍", "text": "# T6 · 性能：把屏幕帧打包从\"逐像素循环\"改成原生实现\n\n> **整份复制给 AI 即可。**\n> **你是只读分析者：不要创建/修改/删除任何文件，不要执行 git，不要连硬件、不要上电。**\n> 代码写在回复里，**不要落盘**。\n\n---\n\n## 0. 你的角色\n\n你是**Python 性能优化**方向的实现者。工作区：`C:\\Users\\29845\\Desktop\\工创赛`。\n\n## 1. 为什么做这件事（有实测支撑）\n\n树莓派侧每分拣一件，在**收到 STM32 的 `ITEM_RESULT` 之后**要把一帧 1024×600 的画面写到屏幕上，\n再发 `DISPLAY_ACK` 关掉 15 秒失活窗。实测这一段耗时 **1.112 s**（单样本，\n`docs/交付/2026-09-19/交接-链路已跑通-2026-09-19.md:43-44`）。\n\n**其中主要开销被判断是**：`电控/src/electrical_control/rpi/display_hdmi.py:220-237` 的\n**Python 逐像素 RGB565 打包循环 —— 1024×600 = 614,400 次**，然后再写 `/dev/fb0` 1,228,800 字节（`:260-263`）。\n\n**目标**：把这段打包改成 numpy 或 Pillow 原生实现，**省下 0.3–0.9 s**。\n背景是**15 秒失活窗余量很小**（实测单件 `ITEM_TASK → DISPLAY_ACK` 约 13.1–14.3 s，窗口 15 s）。\n\n## 2. 你要产出的\n\n1. **优化实现**：给出可直接替换 `:197-263` 那一段的代码（保持函数签名与语义不变）。\n   至少给 **两个版本**：\n   - **A：numpy 版**（向量化：`np.frombuffer` → 掩码/移位 → `astype('<u2').tobytes()`）\n   - **B：Pillow 原生版**（例如 `img.convert(\"RGB\").tobytes(\"raw\", \"BGR;16\")` 一类）\n   **两个版本都必须处理**：16bpp（RGB565 小端）、24bpp、32bpp（fbdev 内存序是 B,G,R[,X]）、\n   以及**行填充 / line_length / stride**（`display_hdmi.py` 里已有 `_read_sysfs` 与 `FramebufferFormat`）。\n2. **依赖检查**：树莓派上有没有 numpy？（给一条查询命令）没有的话 Pillow 版是不是唯一可行？\n   **不要假设装了**——写清\"如果没装怎么办\"。\n3. **逐字节对拍方案**（**这是最重要的验收判据**）：\n   同一张 1024×600 测试帧，**新旧实现对 16bpp / 24bpp / 32bpp 三种格式的输出必须 md5 完全相同**。\n   给出可执行的验证脚本（在主机上就能跑，不需要树莓派）。\n4. **风险与回退**：如果字节序搞反会怎样？给出现场能一眼看出的判据。\n   （已知工具内建了三色条自检，见 `display_hdmi.py:905-952`：屏上从左到右必须是 **红 | 绿 | 蓝**；\n   若看到 **深蓝 | 洋红 | 暗绿** ⇒ 16bpp 字节序反了。）\n\n## 3. 必读文件\n\n- `电控/src/electrical_control/rpi/display_hdmi.py`（**重点**：`:31-32` bpp 说明、`:78-84` `_BYTES_PER_PIXEL`、\n  `:131-170` `read_framebuffer_format`、`:197-263` `encode_frame` 与 FrameOutput 回调、`:905-952` 三色条自检）\n- `电控/tests/rpi/test_framebuffer_pack.py`（**现有测试，必须继续保持通过**；\n  注意其中两例在本机沙箱下会因\"临时目录被拒\"而报 `PermissionError`，那是环境问题不是代码问题）\n- `电控/src/electrical_control/rpi/__init__.py`（看 `_render_and_ack` 的调用顺序）\n- `当前进度与交接.md`（只读；查\"15 秒\"、\"屏\"相关章节）\n\n## 4. 已核实的前提（不要推翻）\n\n* 本屏是 **1024×600 @ 16bpp**（`/sys/class/graphics/fb0/bits_per_pixel = 16`）。\n* `display_hdmi.py` **从 sysfs 读真实 bpp**，绝不假定 32bpp（历史实测：按 32bpp 直写会\n  `[Errno 28] No space left on device`）。\n* 16bpp 走 **RGB565 小端**；24/32bpp 走 **B,G,R[,X]**。\n* **不能改渲染内容**（版面、字体、表格行序都是已验收的），**只改打包这一段**。\n\n## 5. 硬性要求\n\n- 每条结论带 `文件:行号`；无法证实的写「未验证」，**不要猜**。\n- 给出**优化前/优化后的代码对比**与**预期收益的量级依据**（不要编造精确数字）。\n- 结尾给：\n\n```\n[落点] 目标文件：<路径> ｜ 方式：新建/修改 ｜ 语言：<语言>\n[建议执行] <可执行命令清单>\n```\n"}, {"file": "07-T7-评审-对抗性复核.md", "button": "07 T7 评审", "who": "与执行者不同的模型", "attach": "", "task": "对上列全部产出做对抗性复核", "text": "# T7 · 评审：对上列全部产出做对抗性复核\n\n> **整份复制给 AI 即可**（**建议交给与执行者不同的模型**：谁写的方案，就不要让谁审自己）。\n> **你是只读分析者：不要创建/修改/删除任何文件，不要执行 git，不要连硬件、不要上电。**\n> 评审意见写在回复里，**不要落盘**。\n\n---\n\n## 0. 你的角色\n\n你是**对抗性评审官**。你的任务**不是**把别人的方案夸一遍，而是**找它会在现场炸的地方**。\n工作区：`C:\\Users\\29845\\Desktop\\工创赛`。\n\n## 1. 你要审什么\n\n**把用户贴给你的其他 AI 的产出，逐条审。** 本目录下的任务书是它们的输入：\n\n| 文件 | 被审对象的任务 |\n|---|---|\n| `01-T1-视觉-物体必须完整在画面内.md` | 修\"物体部分出画就识别不到\" |\n| `02-T2-固件-派发时序与NACK根因.md` | `NACK_SINGLE_TASK_ONLY` 根因 + 派发时序 |\n| `03-T3-标定-XY行程与落点操作卡.md` | 给朋友的操作卡 + 落点标定 SOP |\n| `04-T4-机械-3落点与转盘2方向.md` | 3 落点 + 转盘 2 方向的机械设计 |\n| `05-T5-夹爪-只动两次的行为确认.md` | \"夹爪只动两次\"是设计还是故障 |\n| `06-T6-性能-屏幕帧打包提速.md` | 屏幕帧打包提速 |\n\n## 2. 每一条产出，必须回答这 9 个问题\n\n1. **证据是否真的支撑结论？** 它引用的 `文件:行号` 对不对？（**自己打开核，不要信它转述**）\n2. **有没有把\"代码推断\"说成\"实测\"？** 有没有把\"单样本\"说成\"统计规律\"？\n3. **它的方案会不会破坏已经跑通的东西？** 现在**实机已跑通整轮**（8/6/9 件，零异常），\n   任何改动都要先回答\"凭什么保证不把这套跑通的东西弄坏\"。\n4. **有没有触到 L4 红线？** 项目级红线包括：改 I/O 映射、修改系统间通信协议、\n   删/覆盖模型权重、改机械图纸、**任何实际硬件上电测试**。\n   如果它的方案**其实需要改协议**却没说，**这是最严重的失分点**。\n5. **验收判据可执行吗？** 是不是\"一条命令/一段日志就能判定\"？还是空话？\n6. **回退路径是什么？** 改坏了怎么回来？有没有备份？\n7. **它的数字算对了吗？** 特别是坐标/步数/时间预算这三类（80 步/mm、5000 Hz 巡航、\n   夹爪物理位置 = 滑台坐标 + (120.5, 43.5)、HOME = (−95.0, −97.5)）。\n8. **它有没有回避最难的那一步？**（最典型：只说\"需要实测\"却不给实测怎么做）\n9. **它有没有可能误导用户去做危险动作？**（例如让机器顶死、让用户带电插拔、让用户改固件而不提醒重烧）\n\n## 3. 输出格式（**照这个格式写，别自由发挥**）\n\n对**每一条**产出：\n\n```\n### 评审对象：<文件名 / 哪一条产出>\n判定：✅ 可用 ｜ ⚠️ 需修改后可用 ｜ ❌ 不可用\n置信度：1-5\n致命问题（0-3 条，每条：现象 → 证据(文件:行号) → 后果 → 最小修法）\n次要问题（0-5 条，同上格式）\n它说对的地方（1-3 条，也要给证据）\n我建议的最小改动（可执行的那种）\n```\n\n最后给一张**总表**：\n\n| 产出 | 判定 | 致命问题数 | 最严重的一条 |\n|---|---|---|---|\n\n以及：**如果你只能让用户先做一件事，是哪一件？为什么？**\n\n## 4. 硬性要求\n\n- **每条意见必须带 `文件:行号`**；**没有证据的意见写「未验证，建议现场确认」**，不要臆断。\n- **不要为了显得严格而编造问题**；也不要为了和气而放过致命问题。\n- 不确定就明说\"我不确定\"，并说清**怎样能确认**。\n- 结尾给：\n\n```\n[落点] 目标文件：<路径>（若你建议落盘）｜ 方式：新建/修改 ｜ 语言：<语言>\n[建议执行] <可执行命令清单>\n```\n"}, {"file": "08-必读补充-跟任一份一起发.md", "button": "08 必读补充", "who": "全部都要发", "attach": "", "task": "★最新事实：行程/坐标口径/Y优先/货格/15秒语义 —— 跟任一份一起发", "text": "# 必读补充（2026-09-21 最新）—— **跟任意一份任务提示词（T1–T7）一起发过去**\n\n> **用法**：先发任务份（T1~T7 里选一份），**紧接着把这一份也发过去**。\n> 任务份说\"你要做什么\"，这一份说\"变了什么、最新事实是什么\"。\n>\n> 🔴 **重要**：我们**已经关掉了之前所有的 AI 对话**。所以请把这一份当成**唯一的上下文来源** ，\n> **不要假设你（或别的 AI）之前看过什么**。这一份里的事实都是最新的、可用的。\n>\n> **红线（对你同样有效）**：只读。不创建/修改/删除工作区任何文件、不执行 git、不连硬件、不上电、不烧录。\n> 代码/方案写在回复里，**不要落盘**。每条结论带 `文件:行号`；证据分【实测】/【代码推断】/【未验证】三档；\n> 结尾给 `[落点] 目标文件：… ｜ 方式：… ｜ 语言：…` + `[建议执行]` 命令清单。\n\n---\n\n# 第一部分 · 用户 2026-09-21 新增的 5 条决定\n\n## 决定 1 · 夹取顺序改成「按行扫描」\n\n```\n第一键：Y 从大到小      —— 从「靠近 Y 正方向」那一排开始，逐行往里\n第二键：同一行内 X 从小到大 —— 从最靠 HOME/内角那件开始，向 +X 依次抓\n```\n\n* **取代**当前的\"离托盘无壁边最近\"规则（`pick_strategy/selector.py`）。\n* 当前实链里接的是 `pick_strategy` 的**选择器**（`--pick-strategy order`，\n  实现见 `电控/src/electrical_control/pick_strategy/chain_adapter.py`）。\n* ✅ **这条不需要改协议、不需要改固件**，只改排序键。\n* ✅ 用户补充：**同一排不会出现并排** ⇒ **不需要\"就近\"次键**。\n\n## 决定 2 · 按类别选张开脉宽，只留 3 个值\n\n* 顺序：**识别类别 → 设脉宽 → 再移动/夹取**；\n* **目的**：不同形状/尺寸的件用不同开度，**避免把旁边的件蹦飞**；\n* ✅ 用户明确：**先台架实测这 3 个值，测准了再决定改固件；不要先改固件再试。**\n* 已知硬约束：`EC_AXIS_GRIPPER_OPEN_US` 是**编译期常量**，**同时**是 `[0]`/`[7]` 两处的开度，\n  且是**单舵机联动**（一个舵机同时决定\"升降\"与\"夹合\"）\n  ⇒ **\"按类别给不同张开脉宽\"必然要动固件（或动协议 = L4）。**\n\n## 决定 3 · 🔴 **Y 优先**（用户强调，确定性结论）\n\n> 用户原话：「**肯定是 Y 优先**……先走靠近 Y 轴正方向那一排，然后再直接往 Y 轴正方向移动，\n> 这样子它可以出去；**要不然它会刮到其他的件**。如果 X 优先……它会把外面那个一起刮飞掉。」\n\n**⇒ 固件里有现成的编译期开关：**\n\n```c\n// 电控/firmware/stm32f407_m144z/App/Inc/ec_motion_plan.h:201-203\n#ifndef EC_MOTION_XY_ORDER_X_FIRST\n#define EC_MOTION_XY_ORDER_X_FIRST 1     // ← 现在：每个路径点【先 X 后 Y】= 会刮飞\n#endif\n\n// 使用处：App/Src/ec_motion_plan.c:56-75  append_ordered_xy()\n```\n\n**⇒ 改成 `0` = 每个路径点【先 Y 后 X】= 用户要的\"先出托盘再横移\"。**\n⚠️ **它是全局的**：也会改变 `HOME → 取料点` 那一段的轨迹 ⇒ **改之前要先把两条腿的轨迹画出来对比。**\n\n## 决定 4 · 目标格不在前 3 个固定点 ⇒ **转盘翻 180°**\n\n* 只有 **3 个固定落点**（A 侧）；B 侧 3 格靠**转盘翻 180°** 转到同样 3 个位置；\n* ⇒ **转盘只需 2 个角度位置**。\n* **可行性推论**：把两组分界装夹在舵机正中心 **1500 µs**，两组各占 **±90°**\n  （对应 **845 / 2155 µs**）⇒ **正好 180° 分离，且两端都在 500–2500 µs 行程内**\n  ⇒ **现有这只 270° 位置舵机直接可用，不需要换舵机、不需要 2:1 增速。**\n\n## 决定 5 · **货格：1 类 1 格**\n\n> 用户原话：「这次只有 6 个物块，6 个物块分别放一个货格。」\n\n⇒ **6 个类别 → 6 个货格，一一对应**，不共用、不分组。\n（\"只用 3 个脉宽\"是**另一件事**：把 6 类按大小/形状归成 3 组、共用 3 个张开开度。）\n\n---\n\n# 第二部分 · 🔴 最新实测数据（用户 2026-09-21，全部以「运动原点」起算）\n\n## 坐标口径（**唯一权威，先记死**）\n\n```\n运动原点 = HOME = 滑台坐标 (−95.0, −97.5)      ← 最里角，上电复位时滑台必须顶在这里\n滑台坐标 → 物理位置：物理 = 滑台坐标 + (120.5, 43.5)   ← ToolOffset，仅用于解释物理位置\n```\n\n## 行程（**两个数不是一回事，别混**）\n\n| | 值 | 含义 |\n|---|---|---|\n| **滑台机械行程** | **X = 29 cm、Y = 29 cm** | **不装夹爪**时的理论行程 |\n| **装夹爪后可用行程** | **X = 18.0 cm、Y = 18.5 cm** | 夹爪会撞到东西 ⇒ **这是链真正能用的** |\n\n**换算到滑台坐标**（距 HOME 起算）：\n\n```\n机械行程 29cm   ⇒ 滑台理论能到  X = −95.0 + 290 = +195.0、Y = −97.5 + 290 = +192.5\n夹爪安全线 18/18.5 ⇒ 滑台只能到  X = −95.0 + 180 = +85.0\n                                 Y = −97.5 + 185 = +87.5\n```\n\n🔴 **固件现在放行到 `X = +90.0`、`Y = +92.5`**（`App/Inc/ec_motion_plan.h:126-127`）\n⇒ **比夹爪安全线还远 5 mm** ⇒ **会超程顶死 ⇒ 丢步 ⇒ 坐标基准漂移**。\n（历史事故：2026-09-21 凌晨 Y 轴顶死后**堵转 → 电流拉高 → 供电跌落 → STM32 欠压重启**，\n坐标基准全废。所以这条必须收紧，**不是放宽**。）\n\n**落点允许范围（滑台坐标）**：`x ∈ [−95.0, +85.0]`、`y ∈ [−97.5, +87.5]`\n\n**当前落点**：`(14.5, 19.0)` ⇒ 距 HOME 只有 **10.95 / 11.65 cm** ⇒ **远在安全区内**。\n\n## 其它已定死的现场事实\n\n| 项 | 值 | 出处 |\n|---|---|---|\n| 步距 | **80 步/mm** | `App/Inc/ec_axis_driver.h:32-33` |\n| 巡航速度 | **5000 Hz**（`MOVE ... HZ f` 里的 `f` **不生效**） | `App/Src/ec_board_stm32.c:200` |\n| 夹爪张开 / 闭合脉宽 | **800 µs / 1900 µs** | `App/Inc/ec_axis_driver.h:86-89` |\n| 单件程序 | **固定 10 步**：`[0]张开 [1]X [2]Y [3]WAIT200ms [4]闭合(夹住) [5]X [6]Y [7]张开(释放) [8]X [9]Y` | `App/Src/ec_motion_plan.c` |\n| 舵机步后整定 | `EC_AXIS_GRIPPER_SETTLE_MS = 600` | `App/Inc/ec_axis_driver.h:90` |\n| 实测单件耗时 | **13.1 ~ 14.3 s**（`ITEM_TASK → DISPLAY_ACK`） | 实机日志 |\n| 实机战绩 | **三轮共 23 件成功分拣（8 + 6 + 9），零异常** | 实机日志 |\n| 起链命令 | `PYTHONPATH=/home/pi/电控/src python3 deploy/run_chain.py --port /dev/serial0 --image-dir /home/pi/images --names-file /home/pi/电控/deploy/names.json --frame-output fb0 --round-id R5 --round-task-id 1 --pick-strategy order --start-round -v` | — |\n| 🔴 `--round-task-id` | **必须是 `1`**（MaixCAM 的 `TASK_ID = 1`，见 `视觉/src/maixcam_deploy/stage1_color_v6_send.py:39`）；写错**整帧被丢** | 今晚踩过 |\n\n---\n\n# 第三部分 · 🔴 「15 秒失活窗」的固件 vs 赛规（**最容易被误解的一条**）\n\n| | 口径 |\n|---|---|\n| **赛规** | 「**15 秒没有动作** 或 没有显示本次分拣信息，本轮比赛结束」⇒ **中间一直在动 ⇒ 不失活** |\n| **固件实现** | 窗口在 **运动开始** 时打开（`App/Src/ec_app.c:197-198 / :312-313`），**只有 `DISPLAY_ACK` 关窗**（`:218-220 / :532`）；\"动作进度续命\"的功能**编译期关着**（`App/Inc/ec_app.h:16-17` `EC_APP_PROGRESS_SOURCE_ENABLED = 0`，且运行时开关默认 `false`，`ec_app.c:582`）|\n\n**⇒ 固件是\"从开始运动到上屏必须 < 15 秒\"，比赛规严。**\n**⇒ 实测单件 14.1~14.3 s，余量只剩 0.7~0.9 s ⇒ 任何\"加路径\"的决定都会立刻超窗。**\n\n要让固件回到赛规口径，得打开 `EC_APP_PROGRESS_SOURCE_ENABLED=1`\n⇒ **这是改安全语义，属 L4**，且注释明确要求先做 **`HIL-PROGRESS-001`** 台架验证。**赛前不建议动。**\n\n**⇒ 推荐路线**：先做\"Y 优先 + 屏幕提速\"，把单件压到 13 秒上下，**窗口就够了**，不必碰安全语义。\n\n---\n\n# 第四部分 · 你要额外回答（在原有任务之外）\n\n1. **这条新规格对你的任务有什么影响？**（没影响就明说\"无影响\"并给理由）\n2. **你的方案要不要跟着改？** 要就给出改动后的方案；不要就说明为什么原方案仍成立。\n3. **有没有哪一条决定是\"做不到\"或\"会破坏已跑通的东西\"的？**\n   ⚠️ 现在实机**已跑通整轮（23 件、零异常）**——任何改动都要先回答\n   \"**凭什么保证不把这套跑通的东西弄坏**\"。\n4. **哪一条决定你觉得风险最大？** 给排序 + 理由 + 最小验证方式。\n5. **你引用的行号请自己打开核**，不要照抄本文档里的行号（文档可能滞后）。\n\n---\n\n# 第五部分 · 待办与决策状态（供你判断优先级）\n\n| # | 事项 | 状态 |\n|---|---|---|\n| 1 | 排序键改成「行扫描」 | **待做**（不用改协议） |\n| 2 | `EC_MOTION_XY_ORDER_X_FIRST` 1 → 0（Y 优先） | **待做**（改固件；先出轨迹对比） |\n| 3 | 固件可达域收紧：正端 `+90.0/+92.5` → `+85.0/+87.5` | **待用户批准**（改固件 + 同步 `[WorkspaceLimits]`） |\n| 4 | 3 个夹爪脉宽台架实测 | **待现场做**（约 20 分钟） |\n| 5 | 3 个固定落点粗放 + 精修 | **待现场做**（约 20 分钟） |\n| 6 | 屏幕帧打包提速（省 0.3~0.9 s） | 已派 T6 |\n| 7 | 视觉「约 1/3 出画就识别不到」 | 已派 T1 |\n| 8 | `NACK_SINGLE_TASK_ONLY` 根因 | 已派 T2（临时修已上线：收到 NACK 退避 0.3 s 立即重发） |\n| 9 | 打开进度源（让固件与赛规一致） | **L4，赛前不动** |\n"}];
const ORDER = [0, 1, 2, 3, 4, 5, 6, 7, 8];
let cur = 0;
const nav = document.getElementById('nav');
const bodyEl = document.getElementById('body');
const metaEl = document.getElementById('meta');

function labelOf(d){ return d.button + (d.who ? ' · ' + d.who : ''); }

ORDER.forEach((i, n) => {
  const d = DOCS[i];
  const b = document.createElement('button');
  b.innerHTML = '';
  b.appendChild(document.createTextNode(d.button));
  const s = document.createElement('span');
  s.className = 'who';
  s.textContent = d.who + (d.task ? ' · ' + d.task : '');
  b.appendChild(s);
  b.onclick = () => show(n);
  nav.appendChild(b);
});

function show(n){
  cur = n;
  const d = DOCS[ORDER[n]];
  bodyEl.textContent = d.text;
  metaEl.textContent = '目标：' + (d.who || '—') + (d.attach ? ' ｜ ' + d.attach : '');
  [...nav.children].forEach((b, i) => b.classList.toggle('on', i === n));
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  setTimeout(() => t.classList.remove('on'), 1100);
}

async function copyText(txt, msg){
  try { await navigator.clipboard.writeText(txt); toast(msg || '已复制'); }
  catch (e) {
    const ta = document.createElement('textarea');
    ta.value = txt; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove(); toast(msg || '已复制');
  }
}

document.getElementById('copy').onclick = () => copyText(DOCS[ORDER[cur]].text);
document.getElementById('dl').onclick = () => {
  const d = DOCS[ORDER[cur]];
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([d.text], {type:'text/plain;charset=utf-8'}));
  a.download = d.file.replace(/\.md$/, '.txt');
  a.click(); URL.revokeObjectURL(a.href);
};
document.getElementById('all').onclick = () => {
  const joined = ORDER.map(i => DOCS[i].text).join('\n\n\n' + '='.repeat(78) + '\n\n\n');
  copyText(joined, '已复制全部');
};

show(0);
