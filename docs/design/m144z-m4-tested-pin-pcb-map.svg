<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1160" viewBox="0 0 1800 1160">
  <defs>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#82b366"/></marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#b85450"/></marker>
    <style>
      .title{font:700 26px Arial,"Microsoft YaHei",sans-serif;fill:#1f2937}.h{font:700 18px Arial,"Microsoft YaHei",sans-serif;fill:#1f2937}.t{font:15px Arial,"Microsoft YaHei",sans-serif;fill:#1f2937}.s{font:13px Arial,"Microsoft YaHei",sans-serif;fill:#374151}.box{rx:8;stroke-width:2}.line{fill:none;stroke-width:2}
    </style>
  </defs>
  <rect width="1800" height="1160" fill="#ffffff"/>
  <text x="900" y="45" text-anchor="middle" class="title">M144Z-M4 实测引脚与 PCB 接口总图（候选，未冻结）</text>
  <rect x="260" y="70" width="1280" height="48" class="box" fill="#f5f5f5" stroke="#666"/>
  <text x="900" y="100" text-anchor="middle" class="t">绿色：GPIO/外设功能已实测　 黄色：排针位置仍待验证　 红色：安全边界</text>

  <rect x="50" y="155" width="515" height="250" class="box" fill="#d5e8d4" stroke="#82b366"/>
  <text x="75" y="187" class="h">三轴运动输出</text>
  <text x="75" y="222" class="t"><tspan x="75" dy="0">X：PC6 STEP / PA7 DIR / PA5 ENABLE</tspan><tspan x="75" dy="27">Y：PB6 STEP / PC7 DIR / PD7 ENABLE</tspan><tspan x="75" dy="27">Z：PE5 STEP / PE6 DIR / PG15 ENABLE</tspan><tspan x="75" dy="40">三轴 STEP / DIR / ENABLE 各自独立</tspan><tspan x="75" dy="27">X/Y A4988 与板外接口二选一（DNP）</tspan><tspan x="75" dy="27">Z 轴只保留板外控制接口</tspan></text>

  <rect x="50" y="435" width="515" height="315" class="box" fill="#d5e8d4" stroke="#82b366"/>
  <text x="75" y="468" class="h">PWM 与补光</text>
  <text x="75" y="503" class="t"><tspan x="75">PB0 TIM3_CH3　BARRIER 1</tspan><tspan x="75" dy="27">PB1 TIM3_CH4　BARRIER 2</tspan><tspan x="75" dy="27">PF6 TIM10_CH1　BARRIER 3</tspan><tspan x="75" dy="27">PF7 TIM11_CH1　BARRIER 4</tspan><tspan x="75" dy="27">PB10 TIM2_CH3　GRIP</tspan><tspan x="75" dy="27">PB11 TIM2_CH4　WRIST（DNP）</tspan><tspan x="75" dy="27">PC0 GPIO　LIGHT_EN</tspan><tspan x="75" dy="38">每路独立接口 + GND_LOGIC + 测试点</tspan></text>

  <rect x="660" y="155" width="480" height="115" class="box" fill="#fff2cc" stroke="#d6b656" stroke-width="3"/>
  <text x="900" y="192" text-anchor="middle" class="h">M144Z-M4 Mini Board</text>
  <text x="900" y="220" text-anchor="middle" class="t">STM32F407ZGT6</text><text x="900" y="248" text-anchor="middle" class="s">GPIO 功能已实测；排母位置候选、未冻结</text>

  <rect x="615" y="300" width="280" height="450" class="box" fill="#fff2cc" stroke="#d6b656"/>
  <text x="635" y="330" class="h">JP_L（2×25）</text>
  <text x="635" y="360" class="s"><tspan x="635">9 PD9　USART3_RX</tspan><tspan x="635" dy="23">10 PD8　USART3_TX</tspan><tspan x="635" dy="23">29 PF6　PWM3</tspan><tspan x="635" dy="23">30 PF7　PWM4</tspan><tspan x="635" dy="23">31 PF8　RESET_SIG</tspan><tspan x="635" dy="23">32 PF11　Z_UP</tspan><tspan x="635" dy="23">34 PB1　PWM2</tspan><tspan x="635" dy="23">35 PB0　PWM1</tspan><tspan x="635" dy="23">38 PA7　DIR_X</tspan><tspan x="635" dy="23">39 PA5　ENABLE_X</tspan><tspan x="635" dy="23">40 PA4　START</tspan><tspan x="635" dy="23">41 PA3　USART2_RX</tspan><tspan x="635" dy="23">44 PA2　USART2_TX</tspan></text>

  <rect x="905" y="300" width="280" height="450" class="box" fill="#fff2cc" stroke="#d6b656"/>
  <text x="925" y="330" class="h">JP_R（2×25）</text>
  <text x="925" y="360" class="s"><tspan x="925">1 PC6　STEP_X</tspan><tspan x="925" dy="23">2 PC7　DIR_Y</tspan><tspan x="925" dy="23">4 PD7　ENABLE_Y</tspan><tspan x="925" dy="23">5 PG15　ENABLE_Z</tspan><tspan x="925" dy="23">13 PG6　X_END</tspan><tspan x="925" dy="23">14 PG7　X_HOME</tspan><tspan x="925" dy="23">19 PB6　STEP_Y</tspan><tspan x="925" dy="23">22 PB11　WRIST_PWM</tspan><tspan x="925" dy="23">23 PB10　GRIP_PWM</tspan><tspan x="925" dy="23">29 PD5　Y_END</tspan><tspan x="925" dy="23">30 PG9　Y_HOME</tspan><tspan x="925" dy="23">36 PC0　LIGHT_EN</tspan><tspan x="925" dy="23">37 PE6　DIR_Z</tspan><tspan x="925" dy="23">38 PE5　STEP_Z</tspan><tspan x="925" dy="23">43 PG13　ESTOP_FB</tspan><tspan x="925" dy="23">44 PG14　Z_DOWN</tspan></text>

  <rect x="1235" y="155" width="515" height="270" class="box" fill="#f8cecc" stroke="#b85450"/>
  <text x="1260" y="187" class="h">安全与人工输入</text>
  <text x="1260" y="222" class="t"><tspan x="1260">PG7 X_HOME　PG6 X_END</tspan><tspan x="1260" dy="27">PG9 Y_HOME　PD5 Y_END</tspan><tspan x="1260" dy="27">PF11 Z_UP　PG14 Z_DOWN</tspan><tspan x="1260" dy="27">PG13 ESTOP_FB（只读）</tspan><tspan x="1260" dy="27">PA4 START　PF8 MANUAL_RESET</tspan><tspan x="1260" dy="38">输入调理器件位保留；参数 TBD</tspan><tspan x="1260" dy="27">急停主回路在板外切断危险动力</tspan></text>

  <rect x="1235" y="455" width="515" height="295" class="box" fill="#d5e8d4" stroke="#82b366"/>
  <text x="1260" y="487" class="h">双 UART（独立接口，禁止并接）</text>
  <text x="1260" y="522" class="t"><tspan x="1260">J_UART_MAIN</tspan><tspan x="1260" dy="27">PD8 USART3_TX → 树莓派 RX</tspan><tspan x="1260" dy="27">PD9 USART3_RX ← 树莓派 TX</tspan><tspan x="1260" dy="27">+ GND_LOGIC</tspan><tspan x="1260" dy="38">J_UART_BACKUP</tspan><tspan x="1260" dy="27">PA2 USART2_TX → 对端 RX</tspan><tspan x="1260" dy="27">PA3 USART2_RX ← 对端 TX</tspan><tspan x="1260" dy="27">+ GND_LOGIC；两路均通过 115200 8N1 实测</tspan></text>

  <path d="M660 210 H585 V270 H565" class="line" stroke="#82b366" marker-end="url(#arrowGreen)"/>
  <path d="M660 230 H590 V590 H565" class="line" stroke="#82b366" marker-end="url(#arrowGreen)"/>
  <path d="M1140 210 H1210 V285 H1235" class="line" stroke="#b85450" marker-end="url(#arrowRed)"/>
  <path d="M1140 230 H1200 V600 H1235" class="line" stroke="#82b366" marker-end="url(#arrowGreen)"/>

  <rect x="50" y="805" width="1125" height="160" class="box" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="612" y="838" text-anchor="middle" class="h">PCB 必须保留</text>
  <text x="612" y="875" text-anchor="middle" class="t"><tspan x="612">2×25 排母与方向丝印｜三轴控制｜六路 PWM/补光｜六路限位｜ESTOP/START/RESET</tspan><tspan x="612" dy="31">主/备 UART｜STEP/DIR/ENABLE/PWM/UART/关键逻辑电源测试点</tspan><tspan x="612" dy="31">SWD、TF/SDIO、USB-OTG、板载 USB-UART 净空｜连接器方向、1 脚和网名丝印</tspan></text>

  <rect x="1235" y="805" width="515" height="205" class="box" fill="#ffe6cc" stroke="#d79b00"/>
  <text x="1492" y="838" text-anchor="middle" class="h">板外，不集成到载板</text>
  <text x="1492" y="875" text-anchor="middle" class="t"><tspan x="1492">DC/DC、树莓派供电、舵机大电流电源</tspan><tspan x="1492" dy="31">Z 轴驱动功率级与电机相线、急停主回路</tspan><tspan x="1492" dy="42">公共逻辑地连续，不用急停切断 GND</tspan></text>

  <rect x="260" y="1045" width="1280" height="70" class="box" fill="#f8cecc" stroke="#b85450"/>
  <text x="900" y="1088" text-anchor="middle" class="h">冻结前：官方针序/连续性 + 封装尺寸 + 真实 EDA + ERC/逐网检查 + 独立审核</text>
</svg>
