<script id="data" type="application/json">{"files":[{"name":"00-总控索引与分工.md","label":"00 总控索引","ai":"你自己看","hint":"","task":"谁做什么、怎么回收、红线在哪","text":"# 多 AI 并行派工包 · 2026-09-20 · 总控索引\n\n> **总控**：DSH（DeepSeek Harness，本会话）。\n> **你（用户）是唯一的信使**：我不自动派发，你把 `01`~`06` 每个文件**整段复制**贴给对应 AI。\n> **平级原则**：六个 AI 之间互不为下属，各自独立产出；我只做「召集 + 汇总 + 交叉核验」，不做指挥。\n\n---\n\n## 〇、并行安全与只读强制（**最重要的一条**）\n\n### 结论：只读可以并行，写文件绝对不行\n\n| | 并行安全吗 | 原因 |\n|---|---|---|\n| **只读**（读代码、读文档、推理） | ✅ **完全安全** | 并发读不会冲突，6 个会话同时读同一份文件没有任何问题 |\n| **写文件** | 🔴 **绝对禁止** | 两个会话同时写，**后写的把先写的吃掉，而且不报错**——会在几小时后才发现仓库变成四不像 |\n\n⇒ 本包的 12 项任务**全部设计为只读**，彼此不重叠 ⇒ 可以并行。\n**但「只读」不能只靠提示词里写一句话**：AI 会「顺手」建笔记、跑测试（跑测试就会生成\n`__pycache__` / `.pytest_cache`，**那也是写文件**）。必须**工具层 + 提示词层两道锁**。\n\n### 锁 1 · 工具层（最有效，启动时就加参数）\n\n| 会话 | 强制只读的做法 | 风险 |\n|---|---|---|\n| **会话 A**（默认 Claude） | 只读模式启动；Claude Code 用 **plan mode**，或只放行 `Read / Grep / Glob` | 🔴 有写权限，**必须加** |\n| **会话 B**（模型不限） | 同上：能读文件 ≠ 可以写文件 | 🔴 有写权限，**必须加** |\n| **DeepSeek** | — | 🔴 有读权限，**按只读执行** |\n| **豆包** | — | 🔴 有读权限，**按只读执行** |\n| **Grok** | — | 🔴 有读权限，**按只读执行** |\n| ~~Codex / ChatGPT~~ | 已下线 | — |\n\n### 锁 2 · 提示词层（已内置进 `01`~`06` 全部六份）\n\n每份提示词里都插入了 `## 【🔴 输出落点：只准写在回复里，禁止碰我任何一个文件】`，\n并声明**该条优先于提示词里其它一切要求**。要点：\n\n1. 禁止创建/修改/删除/移动/重命名**任何**文件（含新建 `.md`/`.txt`/笔记/待办/草稿），**没有例外**。\n2. 禁止执行**任何会产生文件的命令**：不跑测试、不编译、不格式化、不 `pip install`、\n   不动 `__pycache__` / `.pytest_cache` / `build/`。\n3. 全部产出**写在回复正文里**，代码块包裹，前面先写一行\n   `[落点] 目标文件：<相对路径> ｜ 方式：整体新建/整体替换/替换 :起-止 行 ｜ 语言：<x>`。\n4. 不许自己跑验证，改成写 `[建议执行] <完整命令>`，**由我（总控）串行统一执行并回填**。\n5. 能切只读模式就先切。\n6. **偏离自报**：真写了文件必须如实列出完整路径——**隐瞒比犯错严重得多**。\n7. 回执头新增自报字段：`文件写入: 无（我只读，一个文件都没碰）`。\n\n### 我的落盘纪律（总控侧）\n\n- **在所有 6 个 AI 全部回来、我比对完冲突之前，我不写任何代码/配置文件。**\n- 只有等汇总完成、你裁决完分歧，我才**一份一份串行**落盘，每写一份就跑一次最小验证。\n- 落盘前先看 `docs/交付/2026-09-20/改动与风险台账-2026-09-20.md` 的回滚路径。\n\n### 顺带说明为什么这样最省\n\n6 个会话各自「边想边改」的写法，最后必然要人肉合并 6 份互相冲突的改动；\n改成「全部产出文本 + 总控串行落盘」之后，合并成本从「解冲突」降成「挑要哪几条」。\n\n---\n\n## 一、分工表（优势错开，不重复劳动）\n\n| 文件 | 派给 | 任务 | 为什么是它 | 你要附什么材料 |\n|---|---|---|---|---|\n| `02a-会话A-T6-T9-T11-评审官.md` | **会话 A**（默认 Claude） | T6 夹取策略接入前评审 + T9 硬件安全收口 + T11 方案C 草案评审 | 找漏洞/边界/fail-closed 最强 | 不用（本机可直读） |\n| `02b-会话B-T5-T3-固件与屏幕.md` | **会话 B**（模型不限，再开一个窗口） | T5 台架脉宽白名单补丁 + T3 屏幕侧问题 | 读源码出 diff | 不用（本机可直读） |\n| `03-DeepSeek-T7-T8-时序与语义.md` | **DeepSeek** | T7 「15 秒没看到能抓的⇒结束本轮」+ T8 落点与时间预算复核 | 纯逻辑推理 + 公式复算，不需要文件 | 不用；可选附 `run_chain.py` 全文 |\n| `04-豆包-T12-T2-赛规与流程.md` | **豆包** | T12 赛规符合性审查（新）+ T2 搬相机后重标 SOP | 中文长文档/PDF 理解强 | ⚠️ **必须附**：`27年工创.pdf` 第 9–13 页 + 四川省赛细则 PDF |\n| `05-Grok-T1-T4-接线单.md` | **Grok** | T1 相机位移几何核算 + T4 转盘接线单（PWM 扩展板路线） | 联网查手册/规格最强；T1 参数已内嵌不需文件 | T1 不用附件；T4 可选附 PCA9685 板照片、`FC-SPX303Z.pdf` |\n| — | **DSH（我）** | **T10** 仓库↔现场漂移收口 + 68 个 `pi_*.py` 危险分级，以及全部汇总 | 本机+ssh 证据核验是我的强项 | 我自查，不问你要 |\n\n**覆盖度**：T1–T12 共 12 项 + T10 我自做 = **13 条工作流，全部有主，无重叠、无遗漏。**\n\n> 与旧文件 `派工提示词-2026-09-20-十问题分工.md` 的关系：那份是**按任务**分的（T1–T11，内容仍是权威口径）；这份是**按 AI** 重的（新增 T12 赛规审查）。两者口径一致，本包为准。\n\n---\n\n## 二、并行性\n\n**13 条全部可以同时开工**，没有硬阻塞：\n\n```mermaid\nflowchart LR\n  T1[\"T1 相机位移 Δ\"] --> T2[\"T2 重标 SOP\"]\n  T7[\"T7 15秒判据\"] <--> T8[\"T8 落点/时序预算\"]\n  T4[\"T4 接线单\"] --> C[\"方案C 转盘\"]\n  T11[\"T11 方案C 评审\"] --> C\n  T6[\"T6 夹取策略评审\"] --> R[\"接入 run_chain\"]\n  T3[\"T3 屏幕侧\"] --> R\n  T5[\"T5 脉宽白名单\"] --> W[\"现场报脉宽即试\"]\n  T9[\"T9 安全收口\"] --> W\n  T12[\"T12 赛规审查\"] --> ALL[\"全局约束\"]\n  T10[\"T10 漂移收口\"] --> DEP[\"部署纪律\"]\n```\n\n- `T1 → T2` 只是**精度依赖**：T2 的 SOP 把 Δ 当参数写，等 T1 出数再代入即可，不必串行等。\n- `T7 ↔ T8` 互相影响（15 秒逻辑 vs 单件时序预算）⇒ 我故意**给了同一个 AI（DeepSeek）**，保证口径自洽。\n- `T6 / T11` 都是「批准前评审」，不阻塞别人。\n\n---\n\n## 三、统一回执格式（已在每个提示词末尾内嵌）\n\n每个 AI 必须以下面这个头开场，我靠它机器化汇总：\n\n```\n=== 回执 ===\nAI: <名字>\n任务号: <T#>\n状态: 完成 / 部分完成 / 卡住\n置信度: 1-5\n证据缺失项: <n 条>\n逻辑跳跃项: <n 条>\n我改动过的文件: 无 / 列表\n=== 正文 ===\n```\n\n然后正文固定五段：①结论 ②证据 ③方案/补丁 ④待现场确认项 ⑤下一步。\n\n---\n\n## 四、红线（已写进每个提示词）\n\n1. 禁止一切 **git** 操作。\n2. 禁止任何**实机动作**（接线/上电/烧录/发串口/跑链），除非用户当面对该次动作明确授权。\n3. **只读调查 + 出文档/diff 文本**；不要改任何文件（出 diff ≠ 应用 diff）。\n4. 每个断言必须带 `文件:行号` 或原始命令输出；**事实与推断分开标注**；禁止把离线结论说成实机结论。\n5. 不确定写「证据不足」，**绝不允许编造数值**。\n6. 上电/复位前必须先把滑台推到最内侧负角顶住（固件在复位那一刻把当前位置认定为 HOME，不做寻零运动）；顺序错 → 顶死堵转（已发生 3 次）。\n7. X/Y 无限位、无编码器，可达域**非对称**：X ∈ [-95.0, +90.0]、Y ∈ [-97.5, +92.5] mm。\n8. 树莓派上 68 个 `pi_*.py` 里 12 个会写串口/发运动，**跑链期间绝不要跑**。\n\n---\n\n## 五、回收与第二轮（我做的事）\n\n1. **收齐**：你把这六个 AI 的回复贴回给我（或存成 `回复-<AI名>.md` 丢进本目录），我逐条比对。\n2. **交叉核验**：我只对**高风险结论**做轻量抽查（数值复算、行号回查），不重读每个字。\n3. **分歧处理**：若两个 AI 结论冲突，我各留一句「分歧声明」（依据 + 替代方案）交你裁决，**不强行融合**。\n4. **第二轮对抗复核**：模板见 `99-总控汇总与第二轮复核模板.md`——把 A 的产出交给 B 挑错，专门抓「看起来对但其实反例存在」的结论。\n5. **落盘**：汇总结果写入 `docs/交付/2026-09-20/多AI并行-汇总-2026-09-20.md`（我来写），并更新 `当前进度与交接.md`。\n\n---\n\n## 六、你现在要做的事（按顺序）\n\n1. 开 **5 个会话**：\n   - **会话 A**（默认 Claude）→ 贴 `02a-会话A-T6-T9-T11-评审官.md`\n   - **会话 B**（模型不限，再开一个窗口）→ 贴 `02b-会话B-T5-T3-固件与屏幕.md`\n   - **DeepSeek** → 贴 `03-DeepSeek-T7-T8-时序与语义.md`\n   - **豆包** → 贴 `04-豆包-T12-T2-赛规与流程.md`\n   - **Grok** → 贴 `05-Grok-T1-T4-接线单.md`\n2. **所有会话都按只读执行**（见 §〇 锁 1）——**能读文件 ≠ 可以写文件**。\n3. **豆包那条务必先把两份赛规 PDF 附上**，否则 T12 只能做一半。\n4. 五份回复回来后，把回复贴回本会话给我。\n5. 期间不用等我——**T10 我自己在做**。\n\n> 🔴 `_下线-01-Codex-*.md` 与 `_下线-06-ChatGPT-*.md` **不要发送**：\n> 里面的任务已全部转出，误发会造成重复劳动。留着只为 Codex / ChatGPT 恢复后复用。\n\n---\n\n## 七、变更记录\n\n| 时间 | 变更 | 原因 |\n|---|---|---|\n| 2026-09-20 | 初版：6 个 AI 并行（Codex / Claude / DeepSeek / 豆包 / Grok / ChatGPT） | 用户要求全面并行 |\n| 2026-09-20 | 六份提示词统一插入「🔴 输出落点」只读条款 + 回执自报字段 | 多会话共用同一工作目录，**并发写会静默互相覆盖** |\n| 2026-09-20 | **Codex、ChatGPT 下线**：T5→Claude-B，T9→Claude-A，T1→Grok，T3→Claude-B | 两个会话打不开 |\n| 2026-09-20 | 改为**双 Claude 会话**（A/B），总控 DSH **退回纯汇总 + T10** | 用户选择「多开对话」 |\n| 2026-09-20 | 修正：**各 AI 均可读本地文件**，删去「网页版无文件权限」的错误说明 | 用户澄清 |\n| 2026-09-20 | 新增**派工前工作区快照**（`工具/快照校验.py`），派工后 `--diff` 可证明各 AI 有没有写盘 | 把「不要改我的文件」从请求变成可验证 |\n| 2026-09-20 | **定稿：按各模型优势极限分配**（见 §八） | 用户要求「把每个模型的能力和优势发挥到极致」 |\n\n---\n\n## 八、按模型优势的最终分配（定稿）\n\n**原则：一件事只派给「做这件事最强」的那一个会话，不做对称分配、不做互补冗余。**\n提示词本身是**模型无关**的（自包含 + 只读条款），所以下面的指派是**推荐**，不是硬绑定。\n\n| 模型 | 窗口 | 任务 | 为什么是它（用它的哪项长处） |\n|---|---|---|---|\n| **Claude** | 窗口 1 | T6、T9、T11 | **长上下文代码精读 + 找漏洞**。这三件都是「读 epSeek｜`04` 豆包｜`05` Grok（T4）｜`06` ChatGPT（T1）｜`99` 我的工作台\n\n**任务覆盖**：T1–T13 共 13 项，各有唯一归属，无重叠、无遗漏。\n（T10 = 仓库↔现场漂移收口，需树莓派上线，我自做。）\n\n"},{"name":"01-Codex-T5-T9-固件补丁.md","label":"01 Codex","ai":"Codex","hint":"","task":"T5 脉宽白名单补丁 + T9 硬件安全收口","text":"你是 **Codex 节点**，本项目（2027 工创赛 · 智能分拣装置）的**嵌入式固件工程**负责人。本提示词自包含——你看不到我这边任何对话，以下内容就是全部背景。\n\n**你的定位**：能直接读本机代码、能出可编译级 diff。你负责的两项都是「读固件 C 代码 → 出最小补丁」。\n\n---\n\n## 【项目与现场】\n\n工作目录（Windows 本机）：`C:\\Users\\29845\\Desktop\\工创赛`\n\n```\nMaixCAM 相机 172.20.10.9 --主动 TCP 连--> 树莓派 172.20.10.8:8765 --串口 /dev/serial0 115200--> STM32F407\n视觉：MaixCAM 上跑 V6 颜色法，按「颜色+形状」直接输出货格号 1~6\n机构：两轴滑台 X/Y + 单自由度夹爪舵机（+ 待装的转盘舵机）\n```\n\n本机 python 必须用 `py -3`（默认 `python` 指向一个没有 pip 的 venv）。\n\n**先读这三份（顺序不能反）**：\n1. 根目录 `当前进度与交接.md`（全文，不要跳读）——当前状态的唯一权威。\n2. `docs/交付/2026-09-20/改动与风险台账-2026-09-20.md`——动任何文件前必读（11 项改动的回滚路径 + K1–K12 耦合表）。\n3. `电控/firmware/stm32f407_m144z/` 下的固件本身（App/ Core/ MDK-ARM/）。\n\n## 【硬红线】\n\n1. **禁止一切 git 操作。**\n2. **禁止任何实机动作**：不要编译、不要烧录、不要接线、不要发串口命令、不要跑链——除非用户当面对该次动作明确授权。\n3. **只出补丁文本（unified diff）到回复里，绝对不要应用、不要改任何文件。**\n4. 上电/复位前必须先把滑台推到最内侧负角顶住：固件在**复位那一刻**把当前位置认定为 HOME，不做寻零运动（`ec_startup_sequence.c`）。顺序错 → 第一段运动整体偏移 → 顶死堵转（**已发生 3 次**）。\n5. X/Y **无限位开关、无编码器、读不回绝对位置**，且可达域非对称：X ∈ [-95.0, +90.0]、Y ∈ [-97.5, +92.5] mm（`ec_motion_plan.h:126-127`）。\n6. 每个断言必须带 `文件:行号` 或原始命令输出；**事实与推断分开标注**；不确定就写「证据不足」，**绝不编造数值**。\n7. 交付用中文，结构化，不写散文、不客套。\n\n## 【🔴 输出落点：只准写在回复里，禁止碰我任何一个文件】\n\n**这一条优先于本提示词里的其它一切要求。若与别处冲突，以这条为准。**\n\n我现在**同时开着 7 个 AI 会话**，全部指向同一个工作目录 `C:\\Users\\29845\\Desktop\\工创赛`。\n只要有**两个**会话同时写文件，就会互相覆盖——后写的把先写的结果吃掉，**而且不会有任何报错**。\n所以：\n\n1. **绝对不要创建 / 修改 / 删除 / 移动 / 重命名任何文件**，\n   包括**新建** `.md` / `.txt` / 计划文件 / 笔记 / 待办 / 报告 / 草稿 / 临时文件。**没有例外。**\n2. **不要执行任何会产生文件的命令**：不要跑测试、不要编译、不要格式化、不要 `pip install`、\n   不要动 `__pycache__` / `.pytest_cache` / `build/`（跑测试会生成这些目录，**也算写文件**）。\n3. **你全部的产出都写在回复正文里**，用代码块包起来。\n   每条产出前面**先写一行「落点」**，格式：\n\n   ```\n   [落点] 目标文件：<相对路径> ｜ 方式：整体新建 / 整体替换 / 替换 :起-止 行 ｜ 语言：<x>\n   ```\n\n   然后紧接着放代码块。**新建 hint":"","task":"T6 夹取策略评审 + T11 方案C 评审","text":"你是**并行会话 A**（默认给 Claude，换成别的模型也完全没问题），本项目（2027 工创赛 · 智能分拣装置）的**评审官（Reviewer）**。本提示词自包含——你看不到我这边任何对话，以下内容就是全部背景。\n\n**你的定位**：架构安全审查、边界/合规、多角度审议。**你的价值是找漏洞、找反例、找「看起来对但其实不成立」的结论**——不是复述我的方案。\n你负责的两项都是「**批准前评审**」。\n\n---\n\n## 【项目与现场】\n\n工作目录（Windows 本机）：`C:\\Users\\29845\\Desktop\\工创赛`\n\n```\nMaixCAM 相机 172.20.10.9 --主动 TCP 连--> 树莓派 172.20.10.8:8765 --串口 /dev/serial0 115200--> STM32F407\n视觉：MaixCAM 上跑 V6 颜色法（视觉/src/maixcam_deploy/stage1_color_v6_send.py），\n     该文件 :193-197 COLOR_TO_MATERIAL 按「颜色+形状」直接给货格号：\n     cyan=1(青正方体) green=2(绿正方体) red=3(红三棱柱) blue=4(蓝三棱柱) black=5(黑圆柱) orange=6(橙圆柱)\n树莓派侧：电控/deploy/run_chain.py + 电控/src/electrical_control/rpi/\n机构：两轴滑台 X/Y + 单自由度夹爪舵机（+ 待装的转盘舵机）\n```\n\n本机 python 必须用 `py -3`（默认 `python` 指向一个没有 pip 的 venv）。\n\n**先读这些（顺序不能反）**：\n1. 根目录 `当前进度与交接.md`（全文，不要跳读）——当前状态的唯一权威。\n2. `docs/交付/2026-09-20/改动与风险台账-2026-09-20.md`——动任何文件前必读（11 项改动的回滚路径 + K1–K12 耦合表）。\n3. `docs/design/方案C-转盘方案设计草案-2026-09-20.md`（T11 用）。\n4. `电控/src/electrical_control/pick_strategy/` + `docs/交付/2026-09-19/夹取策略模块-*.md`（T6 用）。\n5. `docs/design/interface-contract.md`——V0.9 冻结的协议契约。\n\n## 【三种坐标系（本项目最容易搞错的地方，务必分清）】\n\n1. **识别区**：相机视场，155.4mm 见方（320px × 0.4855 mm/px，旋转约 84.4°）\n2. **夹取区**：夹爪实际够得到的物块位置 = x ∈ [25.5, 210.5] mm、y ∈ [-54, 136] mm\n3. **托盘**：330(X) × 160(Y) mm，壁厚 5mm 向内，**有一边无壁**\n\n⇒ 三者不是同一个坐标系；**「看得见」≠「够得到」**。多个 bug 都出自这里。\n\n## 【硬红线】\n\n1. **禁止一切 git 操作。**\n2. **禁止任何实机动作**：不要接线、上电、烧录、发串口、跑链——除非用户当面对该次动作明确授权。\n3. **只读评审**：不要改任何文件（含 `run_chain.py`）。\n4. 上电/复位前必须先把滑台推到最内侧负角顶住：固件在**复位那一刻**把当前位置认定为 HOME，不做寻零运动（`ec_startup_sequence.c`）。顺序错 → 顶死堵转（**已发生 3 次**）。\n5. X/Y **无限位、无编码器、读不回绝对位置**，可达域**非对称**：X ∈ [-95.0, +90.0]、Y ∈ [-97.5, +92.5] mm（`ec_motion_plan.h:126-127`）。\n6. 每个断言必须带 `文件:行号` 或原始命令输出；**事实与推断分开标注**；不确定就写「证据不足」，**绝不编造数值**。\n7. 交付用中文，结构化，不写散文、不客套。\n\n## 【已定案的口径（别再重新讨论，直接采用）】\n\n- 相机位移目标 Δ ≈ (+39, +35) mm（只平移：只改 tx/ty）\n- 识别区大小不改\n- 托盘 330(X)×160(Y)，壁厚 5mm 向内，有一边无壁\n- 托盘与转盘**不同高度**\n- 转盘舵机 = **360° 连续旋转舵机**，5V 先试，走 **PWM 扩展板**（已确认实物 = PCA9685 16 路 I2C 板）\n- 零位 = 只装一个光电开关做索引\n- 落点 `[DropPoints] = (14.5, 19.0)` ⇒ 夹爪物理释放点 = `(135.0, 62.5)`\n- 货格映射 `class_id N → 货格 N`\n- 15 秒判据 = 「**连续 15 秒没看到『能抓的』东西 ⇒ 结束本轮**」\n- 急停按钮**暂时不装**\n\n## 【🔴 输出落点：只准写在回复里，禁止碰我任何一个文件】\n\n**这一条优先于本提示词里的其它一切要求。若与别处冲突，以这条为准。**\n\n我现在**同时开着 5 个 AI 会话**（2 个 Claude + DeepSeek + 豆包 + Grok），全部指向同一个工作目录 `C:\\Users\\29845\\Desktop\\工创赛`。\n只要有**两个**会话同时写文件，就会互相覆盖——后写的把先写的结果吃掉，**而且不会有任何报错**。\n所以：\n\n1. **绝对不要创建 / 修改 / 删除 / 移动 / 重命名任何文件**，\n   包括**新建** `.md` / `.txt` / 计划文件 / 笔记 / 待办 / 报告 / 草稿 / 临时文件。**没有例外。**\n2. **不要执行任何会产生文件的命令**：不要跑测试、不要编译、不要格式化、不要 `pip install`、\n   不要动 `__pycache__` / `.pytest_cache` / `build/`（跑测试会生成这些目录，**也算写文件**）。\n3. **你全部的产出都写在回复正文里**，用代码块包起来。\n   每条产出前面**先写一行「落点」**，格式：\n\n   ```\n   [落点] 目标文件：<相对路径> ｜ 方式：整体新建 / 整体替换 / 替换 :起-止 行 ｜ 语言：<x>\n   ```\n\n   然后紧接着放代码块。**新建文件也一样——把内容贴在回复里，不要落盘。**\n   我自己会在 6 个 AI 全部回来、比对完冲突之后，统一决定什么时候写入。\n4. **不许自己跑验证**（会写文件）。改成写一句 `[建议执行] <完整命令>`，\n   由我**串行**统一执行并回填结果。\n5. **能切只读模式就先切**（强烈建议，这是最可靠的一道锁）：\n   - Codex：`--sandbox read-only`\n   - Claude Code：plan mode，或只放行 `Read / Grep / Glob` 三个工具\n   - 其他 AI 会话：**无论你用什么方式接进来（IDE / 桌面端 / 直接读盘 / 上传文件），一律按只读执行**；有权限不等于可以写。\n6. **偏离自报**：如果你确实写了任何文件（哪怕一个字节），**必须在回执里如实列出完整路径**。\n   **隐瞒比犯错严重得多**；如实报告不会让你这次任务作废。\n\n---\n\n## 【交付格式（严格照写，我要用来做多 AI 汇总）】\n\n正文最前面先写这个回执头：\n\n```\n=== 回执 ===\nAI: <你的名字>（会话 A）\n任务号: T6+T11\n状态: 完成 / 部分完成 / 卡住\n置信度: 1-5\n证据缺失项: <n 条>\n逻辑跳跃项: <n 条>\n我改动过的文件: 无\n文件写入: 无（我只读，一个文件都没碰）\n=== 正文 ===\n```\n\n正文按五段：①结论（一段话，含置信度与最大不确定性）②证据（带 `文件:行号`）③我建议改什么（给 diff 文本但**不要应用**）④待现场确认项（清单 + 判据）⑤下一步（按依赖排序 1~3 条）。\n\n---\n\n# 任务 T6 · 夹取策略「接入前评审」（模块由用户朋友在做）\n\n## 【目标】\n\n用户的朋友正在做夹取策略模块。请做**接入前的评审与接入设计**，**不要自己重写模块**。\n\n## 【已知情况】\n\n- 模块位置：`电控/src/electrical_control/pick_strategy/`（planner/selector/executor/geometry/config/state_machine），\n  配套 `电控/deploy/run_pick_strategy.py`、**52 个测试**、2 份文档（`docs/交付/2026-09-19/夹取策略模块-*.md`）\n- 它**离线完成、从未接入 `run_chain.py`、从未上过实机**（`run_chain.py` 全文无 `pick_strategy` 引用）\n- 它自己的设计要点（`planner.py:1-19`）已写清两个坐标系：\n  - 「抓取点 / 托盘 / 退出口」在**物料坐标**\n  - 「滑台记账坐标」= 物料坐标 + `tool_offset`\n  - **整链只有 PICK 会被叠加 ToolOffset，落料点不叠加**（`vision_ingest.py:226-236` 直接写进 wire）\n- 它的新路径是「空爪平移 → 原地夹取 → **沿无壁边法线退出** → 横向搬运 → 松爪 → 空爪回位」\n- ✅ 用户 2026-09-20 说明：**托盘有一边无壁**（原话：「我们会先让它往 X 轴正方向走，这样有一边没有高度，就可以直接出去」）\n  ⇒「沿无壁边退出」在物理上成立，但要确认**无壁边在哪一侧**、以及退出方向与固件路径是否兼容。\n\n## 【关键风险（务必核实）】\n\n固件侧 `ITEM_TASK` 能表达的运动是**固定程序**：`HOME → PICK → (Z 闭合) → PLACE → (Z 张开) → HOME`，\n每段是**单轴分步**（`ec_motion_plan.c`，X 腿先 Y 腿后）。\n\n⇒ 若新策略需要**额外航点**，必须改协议 + 固件（**属 L4，要先出设计并经用户批准**）；\n或者退化成「用现有 6 段能表达的近似」。**请明确二选一，不要含糊。**\n\n## 【其他约束】\n\n- 固件生效可达域非对称：X ∈ [-95, +90]、Y ∈ [-97.5, +92.5]（`ec_motion_plan.h:126-127`）\n- 每件 **15 秒失活窗口**：从运动开始计时，只有 `DISPLAY_ACK` 能关\n  （`ec_app.c:197-198/218-223/552-566`），实测 **13.16~13.53s / 15s ⇒ 只剩约 1.5~1.8s 余量**。\n  多绕航点会直接吃掉它。\n- 失败必须 **fail-closed**（宁可不出货，也不要用 `(0,0)` 顶替）\n\n## 【你要交付什么】\n\n1. **评审意见**：模块与线上口径是否一致（尤其两个坐标系、fail-closed、拒识语义）。\n2. **接入设计**：在 `run_chain.py` 哪一步替换/包装（关键注入点见 `run_chain.py:706-785`），\n   如何保持 `pick_x`/`pick_y` 语义、拒识如何记日志、会不会影响 `success` 计数。\n3. **「能不能用现有 ITEM_TASK 表达」的判定表**：逐条列出新策略需要的航点 vs 固件固定 6 段，\n   给出「可表达 / 不可表达」，不可表达的明确标注「**需协议改动（L4，先设计后批准）**」。\n4. **时间预算核算**：接入后单件是否仍在 15s 内；超了给降级方案。\n5. **最小验证计划**：先主机侧 `--fake-link` 冒烟，再做什么、现场怎么验、失败怎么回滚。\n\n## 【硬约束】\n\n只出评审与设计；**不要改 `run_chain.py`**，不要碰设备。\n\n---\n\n# 任务 T11 · 方案 C 设计草案评审\n\n## 【目标】\n\n评审 `docs/design/方案C-转盘方案设计草案-2026-09-20.md`，找出漏洞、遗漏与**更省的做法**。\n\n## 【草案的核心结论（供你核对，逐条判真假）】\n\n1. **不需要新增命令字**：`ITEM_TASK`（`0x21`，12 字节）的 **offset 7 已经是一个冻结的预留角度字节 `grip_angle`**，\n   契约明确「0-180 保留本轮不用、`0xFF` = 无效/不旋转」\n   （`docs/design/interface-contract.md:142/161/166`；`电控/stm32_logic/include/ec_protocol.h:155/164/173`）。\n2. **两端 fail-closed 锁死**：\n   - 固件 `ec_protocol.c:165`（encode）与 `:192`（decode）：\n     `if (grip_angle != EC_PROTO_ITEM_TASK_ANGLE_NONE) return false;`\n   - 树莓派 `电控/src/electrical_control/protocol/item_context.py:140-141` 与 `:170`：\n     `raise PayloadError(\"grip_angle must be 0xFF\")`\n   ⇒ **升级顺序天然安全**：旧固件 + 新树莓派 ⇒ 整帧拒收（**不会静默投错箱**）；\n   新固件 + 旧树莓派 ⇒ 按「不转」处理（向后兼容）。\n3. **两条互斥路径**：\n   - **乙（草案推荐，且实物已确认可行）**：转盘由**树莓派**通过 **PCA9685 16 路 I2C 板**直控\n     （接 I2C-1 = GPIO2/GPIO3，已核实空闲；索引接树莓派 GPIO17）\n     ⇒ **不改协议、不改固件、不重烧**，且转盘动作天然落在 15 秒窗口之外 ⇒ **不是 L4**\n   - **甲**：复用 offset 7（`0xFF`=不转，1..6=格号）⇒ 协议**语义变更**，属 L4，但零帧长变化、零命令字变化\n4. **时序（关键）**：转盘旋转安排在「**视觉识别到新一件之后、发 `ITEM_TASK` 之前**」\n   ⇒ 那一段**没有失活窗口开着**（窗口在收到 `ITEM_TASK` 开始运动时才开）⇒ 转盘耗时**不计入 15 秒预算**\n5. **零位**：360° 是连续旋转舵机（脉宽 = 速度不是角度、**无位置反馈**）⇒ **索引传感器是必需件**；\n   上电必须先回零，回零失败 ⇒ **fail-closed 拒绝开工**，不许猜着转。索引必须用**常开(NO)**输出。\n6. **命令字占用表**：`0x01–0x06`、`0x20–0x26` 已占；`ec_config_handler.c:32-34` 也声明了 `0x20/0x21/0x22`\n   （台账 E-10 的撞号事故）⇒ 若日后确需新命令字，**从 `0x27` 起取**。\n\n## 【你要交付什么】\n\n1. **逐条评审**：上面 6 条哪些对、哪些有漏洞或反例。\n2. **遗漏检查**，特别关注：\n   - 转盘「转到位」如何判定？连续旋转舵机无反馈，只能计时或等索引；\n     若索引盘只有一个标记 ⇒ 每格无法校验 ⇒ **误差会不会累积**？草案的「每件先回零再计时定位」够不够？\n   - 转盘正在转的时候如果收到下一件 `ITEM_TASK` 会怎样？有没有互锁？\n   - 15 秒窗口之外，**赛规层面**有没有「装置长时间无动作」的扣分？（固件窗口不管，但裁判可能管）\n   - 掉电/复位时转盘位置未知 ⇒ 与「滑台推回负角再上电」是同一类问题，**恢复规程要不要一起写**？\n   - 光电开关 24V NPN 接树莓派 3.3V 域的电平安全（草案已写「接线前量黑线对地电压」）。\n3. **更省的替代方案**（如果有）：例如「转盘改用位置舵机/步进」是否更简单、是否值得换件。\n4. **批准建议**：给出「**可以批准** / **先补哪几条再批准**」的明确结论。\n\n## 【硬约束】\n\n只读评审；不要改任何文件、不要改固件、不要接线。\n\n---\n\n## 【附：本任务额外要求】\n\nT6 与 T11 都有一个「**看起来对但其实不成立**」的高风险区（T6 是航点可表达性，T11 是零位误差累积）。\n请对这两个问题各写一段**最坏情况推演**：如果我的假设错了，现场会**具体怎么坏**、在多长时间后暴露、有没有可观测的前兆信号。\n"},{"name":"02b-ClaudeB-T3-屏幕侧问题.md","label":"02b Claude-B","ai":"Claude（窗口 2）","hint":"","task":"T3 屏幕侧问题","text":"你是**并行会话 B**（模型不限，你想开给哪个 AI 都行），本项目（2027 工创赛 · 智能分拣装置）的**固件补丁与屏幕侧定位**负责人。本提示词自包含——你看不到我这边任何对话，以下内容就是全部背景。\n\n**你的定位**：能直接读本机代码、能出可编译级 diff。\n你负责 **T3** 屏幕侧问题定位与修复方案（读 Python 出 diff）：「**定位根因 → 出补丁文本**」。\n（另一件 **T13 转盘舵机代码**在单独一份提示词 `07-T13-转盘舵机代码.md` 里，请一并接做，同属树莓派侧 Python。）\n\n---\n\n## 【项目与现场】\n\n工作目录（Windows 本机）：`C:\\Users\\29845\\Desktop\\工创赛`\n\n```\nMaixCAM 相机 172.20.10.9 --主动 TCP 连--> 树莓派 172.20.10.8:8765 --串口 /dev/serial0 115200--> STM32F407\n视觉：Ma 目（2027 工创赛 · 智能分拣装置）的**转盘舵机驱动与控制代码**。本提示词自包含——你看不到我这边任何对话，以下内容就是全部背景。\n\n**核心要求**：现在有若干物理量**还没测量**。你的任务不是等测量结果，而是把它们**全部做成配置项 + 一条自标定流程**。**任何未知量都不许写死。**\n\n---\n\n## 【项目与现场】\n\n工作目录（Windows 本机）：`C:\\Users\\29845\\Desktop\\工创赛`\n\n```\nMaixCAM 相机 172.20.10.9 --主动 TCP 连--> 树莓派 172.20.10.8:8765 --串口 /dev/serial0 115200--> STM32F407\n机构：两轴滑台 X/Y（STM32 + A4988）+ 单自由度夹爪舵机（PB10 / TIM2_CH3）\n新增：转盘舵机（360° 连续旋转）由【树莓派】经 PCA9685 直控；一个光电开关做索引\n树莓派输出：HDMI /dev/fb0 1024×600\n```\n\n本机 python 必须用 `py -3`（默认 `python` 指向一个没有 pip 的 venv）。\n\n**先读这几份（顺序不能反）**：\n1. 根目录 `当前进度与交接.md`（全文，不要跳读）——当前状态唯一权威\n2. `docs/交付/2026-09-20/改动与风险台账-2026-09-20.md`——动文件前必读（回滚路径 + K1–K12 耦合）\n3. `docs/design/方案C-转盘方案设计草案-2026-09-20.md`——转盘方案（**路径乙 = 树莓派直控，不是 L4**）\n4. `电控/src/electrical_control/rpi/` 下的现有代码——**照它的风格写**，不要另立一套\n\n## 【硬件事实（已核实，可直接引用）】\n\n**PCA9685 16 路 I2C 驱动板**（用户已拍照确认板载丝印）：\n\n```\nVCC: 3-5V   Logic: 3-5V   V+: 6V Max   Freq: 40-1000Hz   Use V+ for servo supply\n排针：GND / OE / SCL / SDA / VCC / V+      每通道端子：PWM / GND / V+\nI2C 默认地址 0x40\n丝印警告：Terminal block is reverse polarity protected. Side breakout pins are not!\n```\n\n**树莓派侧引脚**（已核实：`电控/` 下 grep `RPi.GPIO|gpiozero|pigpio|smbus|I2C` **零命中**，只有 `import serial` 两处）：\n\n- 空闲可用：I2C-1 = **GPIO2（针 3）/ GPIO3（针 5）**；**GPIO17（针 11）**；**GPIO27（针 13）**\n- 🔴 **已被占用、不得动用**：GPIO14 / GPIO15（`/dev/serial0` → STM32）\n- 索引开关 = `FC-SPX303Z`（**槽型／U 槽，对射式**，940nm 红外，**槽宽 5/10/15mm**，NPN.NO.NC，12~24VDC）\n  —— **用户 2026-09-20 现场确认是 U 型**，\n  **接黑线（NO）** → **GPIO17**，**用树莓派内部上拉（`PUD_UP`），不加任何外部电阻**\n  - 内部约 50kΩ + 线容 ~100pF ⇒ 上升 ≈25µs，比传感器 300µs 响应快 12 倍 ⇒ 足够\n  - 遮挡 ⇒ 输出拉低 ⇒ 读到 **0**；未遮挡 ⇒ 悬空被上拉升到 3.3V ⇒ 读到 **1**\n  - 🔴 **断线 = 悬空 = 被上拉读成「无信号」⇒ 报错**，而**不会错格**（这是选 NO 而不是 NC 的唯一理由）\n  - **槽型靠遮光工作 ⇒ 标记必须能「伸进 U 槽挡住光路」**，材质与颜色无关\n  - 仍留配置项 `INDEX_ACTIVE_LOW`（万一实测极性相反时不用改代码）\n- **索引标记 = 6 个挡片，伸进 U 槽**（用户 2026-09-20 现场确认开关是 **U 型/槽型**）\n  - 🔴 **不要用\"盘面贴黑胶带\"**：槽型是**对射式**，靠**遮光**工作，**贴在盘面上的胶带永远读不到**\n  - 挡片**材质与颜色无所谓**（黑/白/透明以外的任何不透明薄片都行）\n  - 挡片厚度 **必须小于槽宽**（留余量，建议 1118` `task_timeout_s=5.0`。\n   正常分拣每件都会重传 2 次并各收到一次 `DUPLICATE`（因为运动要 12s > 5s）。\n   ⚠️ **不要拿「重传次数」当异常指标**；判断板子是否断电的判据是「**有没有** `DUPLICATE`」。\n3. **「空闲 15 秒没看到能抓的东西 → 结束本轮」（要新加，就是本任务）**：\n   当前 `run_chain.py` 在 `SchedulerState.READY` 下**无限等待**\n   （日志会一直刷 `空闲: state=READY success=N`，见 `/home/pi/logs/test2-20260920-105107.log` 尾部）。\n\n## 【已核实的事实（用于设计）】\n\n- 链初始状态是 `RECOVERY_LOCK`，**只有 `--start-round` 能解锁**（`run_chain.py:1060`、`:1091-1095`）\n- 视觉源是**动态源**：`SocketVisionSource` 每次 ingest 一批 `BATCH_TARGETS`，链从最新一批取一件；\n  没有新物体时 READY 循环空转（`:1166-1174`）\n- 被拒识（越界 / 像素域外 / 件高表缺项）会打 WARNING 但不进队列，**也会让 READY 空转**\n  ⇒「没有物体」和「有物体但全被拒」在外部都表现为空转；**日志能区分**（前者无拦截日志，后者有「越界…拒识该件」）\n- 收尾必须干净：跑完要 `pkill -f \"[r]un_chain.py\"`\n  （`timeout N` 到点后进程**不保证退出**，会一直占 `/dev/serial0`）\n- 日志必须落持久路径 `/home/pi/logs/`（**不要写 `/tmp`**，tmpfs 重启即清）\n\n## 【你要交付什么】\n\n1. **语义定义（最容易做错的地方）**：\n   - 计时起点是什么？「本轮从未看到能抓的」还是「连续 N 秒没看到新的、能抓的」？\n   - 正在飞的任务（已发 `ITEM_TASK` 等 `MOTION_DONE`）算不算空闲？\n   - **同一条物块被反复识别**（因为落点就在附近、物块会被再看到）算不算「看到能抓的」？\n     ⚠️ 这一条很实际：当前落点让物块会被重复看到 ⇒ 若算「看到」，**本轮可能永不结束**。\n   给 **2~3 个候选定义** + 各自行为与风险，**推荐一个**并说明理由。\n2. **代码补丁草案**：改哪个函数、加什么状态、怎么与现有 `SchedulerState` 共存、\n   如何优雅收尾（不吞在飞任务、不留下占串口的进程、屏幕怎么处理、日志打什么）。\n   注意：这条逻辑**只在树莓派侧**，不涉及协议、不涉及固件 ⇒ **不是 L4**；\n   但会改变实链行为，落地前仍需用户批准 + 现场验证。\n3. **验收判据**：给出「能证明它**真的结束**而不是卡住」的日志判据（具体日志行 + 退出码 + 串口是否释放）。\n4. **边界情况清单**：用户中途放上物块会不会被误判结束、重传期间超时、急停期间超时等。\n5. 顺带评估：这条逻辑与方案 C 的「转盘动作安排在件与件之间」**有没有冲突**。\n\n## 【硬约束】\n\n只出设计与补丁草案；**不要改 `run_chain.py`**、不要跑链、不要碰设备。\n\n---\n\n# 任务 T8 · 落点 / 15 秒预算复核（落点已改，需复盘）\n\n## 【目标】\n\n复核已落盘的新落点，并给出后续落点变更的判据。\n\n## 【已完成（2026-09-20）】\n\n- 树莓派 `/home/pi/sorting_config.ini` 的 `[DropPoints]` 1~6 已由 `(20.0, 20.0)` 改为 **`(14.5, 19.0)`**\n- 生产加载器 `load_drop_points` 回读 `{1..6: (145, 190)}` mm10，校验 True\n- **夹爪物理释放点 = `(135.0, 62.5)`**（= 配置值 + `ToolOffset(120.5, 43.5)`）\n- 备份：`sorting_config.ini.bak-droppoint-20260920-141645`\n\n## 【已核实的量化事实】\n\n- 单件步数守恒公式（**抓取点落在 HOME↔落点 矩形内时成立**）：\n  ```\n  Σ步数 = 16 × (落点x_mm10 + 落点y_mm1 知参数（树莓派 `电控/calibration_config.ini`，链真正读的那份）】\n\n```\nx =  0.047142·u - 0.483206·v + 148.453\ny = -0.483206·u - 0.047142·v +  52.105\ncamera_height = 262.0 mm\n```\n\n- 像素比例：**0.4855 mm/px**，图像 **320 × 320 px**\n- `ToolOffset = (-120.5, -43.5)`（树莓派上现用）\n- 用户实测相机中心 = **(75.0, -27.5)**（距 X 内角 170mm、Y 内角 70mm）\n- 仿射光轴落点（帧中心 160,160）= **(78.7, -32.8)**\n\n## 【我算出的结论（**请独立复算并核验，不要直接采信**）】\n\n- 目标 = 让视场覆盖「**托盘 ∩ 夹爪可达带**」这块可用区\n- 按托盘 330×160（内角 = HOME，壁厚 5mm 向内）算：\n  - 托盘内腔 `320 × 150 = 48000 mm²`；夹爪可达 `185 × 190 = 35150 mm²`；\n  - 两者重合 = `185 × 111.5 = 20628 mm²` ⇒ **只有 43% 的托盘内腔机械够得到**\n  - 够不到的带：`x < 25.5`（宽 115.5mm）、`y < -54`（高 38.5mm）\n- 相机位移（覆盖可用区的比例）：\n  | Δ | 覆盖可用区 |\n  |---|---|\n  | 不动 | 62.3% |\n  | **Δ = (+39, +35)** | **84.4%（我算出的最优）** |\n  | Δ = (+39, +74) | 70.8%（**这是早先算错的版本，已作废**） |\n- 我认为 **84.4% 就是上限**：那个 `185 × 111.5` 的矩形要 **195mm 见方**的视场才装得下，\n  而视场只有 **155.4mm**。\n- **一条给机械组的硬判据**：视场能完整容纳的**轴对齐正方形上限**\n  ```\n  155.4 ÷ (cos5.6° + sin5.6°) ≈ 142 mm\n  ```\n  ⇒ 若想让「看得见就抓得到」接近 100%，**托盘内腔需 ≤ 140×140 并放进可达带内**。\n  （计划中的内腔 150×150 超了 8mm，装不进；330×160 差得更远。）\n\n## 【你要交付什么】\n\n### 1.《相机位移决策书》\n\n- **独立复算**最终 Δ。请：\n  - 用代码解释器**真的算一遍**（把 θ=84.4° 的旋转视场与托盘/可达带做多边形求交，算面积）；\n  - 明确写出你用的**方法、公式、以及与我上面数字的差异**（如果一样，说明你复现了；如果不一样，指出我错在哪）；\n  - 列出「托盘若改成 ≈145×145 并挪进可达带」时的**另一组 Δ**。\n- ⚠️ **请特别检查我这两处最容易出错的地方**：\n  1. 视场是**旋转**的（约 84.4°），不是轴对齐的——你有没有正确用旋转矩形求交？\n  2. 「可用区 = 托盘 ∩ 夹爪可达带」，**不能只看托盘、也不能只看可达带**。\n     （我早先犯过这个错：忽略托盘约束会得到一个虚高的覆盖率。）\n  3. 是否应该同时考虑「物块本身有尺寸」（例如 40mm 见方）——若考虑，最优 Δ 会不会变？\n\n### 2.《搬相机现场操作卡》（**给不写代码的人看，逐步可照做**）\n\n- **搬前**：物块放同一物理位置不动，记日志里的 `pixel_to_device=(…)` 得 **A**\n- **搬后**：同位置再记一次得 **B** ⇒ **Δ = A − B**\n  （**连尺子都不用，也不用对准机器轴**）\n- **验证**：用新 tx/ty 重算视场四角，确认覆盖住可用区\n- 给出**每一步的判据**与**失败回退**（例如：如果搬完发现 Δ 与预期差 > 10mm，先检查什么？）\n\n### 3. 明确「只平移 ⇒ 只改 tx/ty，其余 5 个参数与 ToolOffset 一律不动」的理由\n\n（纯平移下残差格局不变；若改转向或高度，则**必须重新拟合仿射且重测 ToolOffset**。）\n⚠️ 但请注意：**现有口径说「ToolOffset 不动」**，而你上面看到的资料又说「相机一搬、ToolOffset 必须重做」——\n**请指出这两句话是否矛盾，并给出正确处理**（这是本任务最需要你发现的一个坑）。\n\n## 【硬约束】\n\n只读分析 + 出文档；**不要改配置文件、不要碰设备**。区分「已核实」与「依赖未知量」。\n\n---\n\n## 【附：T1 的额外要求】\n\nT1 的每个数字都要能被**独立重算**出来，请把**计算过程 / 代码片段一并贴出**——\n我要能照着复算，而不是只接受一个结论数字。\n特别地：视场是**旋转**的（约 84.4°），不是轴对齐的，请确认你用对了旋转矩形求交；\n并且「可用区 = 托盘 ∩ 夹爪可达带」，**不能只看其中一个**。\n"},{"name":"99-总控汇总与第二轮复核模板.md","label":"99 总控台","ai":"你自己看","hint":"","task":"汇总表 / 分歧登记 / 第二轮对抗复核模板","text":"# 总控汇总与第二轮复核模板 · DSH 使用\n\n> 本文件是**我（总控 DSH）的工作台**，你（用户）不需要回复它。\n> 你只需要把六个 AI 的答复贴回给我，我按下面的结构收口。\n\n---\n\n## 一、汇总表（我逐条填）\n\n| 任务 | 主做 AI | 状态 | 置信度 | 关键结论（一句话） | 我抽查了什么 | 与其它 AI 是否冲突 | 需要你决策的项 |\n|---|---|---|---|---|---|---|---|\n| T1 相机位移核算 | ChatGPT | | | | | | |\n| T2 重标 SOP | 豆包 | | | | | | |\n| T3 屏幕侧 | ChatGPT | | | | | | |\n| T4 转盘接线单 | Grok | | | | | | |\n| T5 脉宽白名单 | Codex | | | | | | |\n| T6 夹取策略评审 | Claude | | | | | | |\n| T7 15 秒判据 | DeepSeek | | | | | | |\n| T8 落点/时序 | DeepSeek | | | | | | |\n| T9 安全收口 | Codex | | | | | | |\n| T10 漂移收口 | DSH（我） | | | | | | — |\n| T11 方案C 评审 | Claude | | | | | | |\n| T12 赛规审查 | 豆包 | | | | | | |\n\n**收口的四条纪律**（来自跨节点协作约定）：\n1. 派出去就信任产出，**不重读每个字**；只对**高风险结论**做轻量抽查（数值复算 + 行号回查）。\n2. 抽查只回答一件事：**这个数字/行号能不能复现**。不能复现 → 标 `UNVERIFIED`，不进结论。\n3. 六个 AI 平级，**没有谁的意见天然优先**；分歧不融合、不压服。\n4. **未调用的不写 CALLED**：谁的回复没到，就写 `NOT_CALLED`，不替它编。\n\n---\n\n## 二、冲突登记格式（有分歧时用）\n\n```markdown\n### 分歧 D-<序号>：<一句话争议点>\n- 甲方：<AI 名> · 依据：<文件:行号 / 命令输出> · 结论：<…>\n- 乙方：<AI 名> · 依据：<…> · 结论：<…>\n- 我的核查：<我实际执行的命令 + 原始输出>（若无法核查，写\"未核查\"）\n- 替代方案：<甲/乙各自的代价>\n- **待用户裁决**：<二选一或三选一的具体选项>\n```\n\n> 用户裁决后回写 `docs/冲突与决策台账-2026-09-10.md`（该文件是**冲突的唯一权威**）。\n\n---\n\n## 三、第二轮：对抗性交叉复核（模板，按需贴给另一个 AI）\n\n六个 AI 都回来后，如果某条结论**风险高且我无法在本机复现**，就用下面模板把它交给**另一个 AI** 挑错。\n\n**选人规则**：不要让原作者复核自己；优先「让 Claude 复核 Codex 的补丁」「让 Codex 复核 ChatGPT 的几何算法」。\n\n```\n你是 **对抗性复核员**。你的唯一任务是**推翻**下面这份结论，不是复述它。\n\n【待复核结论】\n<把 A 的 ①②③ 段整段贴进来>\n\n【复核要求】\n1. 逐条判定：**成立 / 有条件成立 / 不成立**，并给理由。\n2. **必须主动构造至少 3 个反例或反场景**：\n   - 一个「参数取边界值」的场景；\n   - 一个「测量存在误差」的场景（例如 ±5% 或 ±2mm）；\n   - 一个「按它的做法执行后，系统在另一种输入下坏掉」的场景。\n3. 找出**被隐藏的假设**：这份结论默认了什么却没写出来？（例如\"默认抓取点在矩形内\"、\"默认 act: 无——本轮只写了 7 个文档，未改任何代码/配置，未碰设备\nartifacts:\n  - 派工-多AI并行-2026-09-20/00-总控索引与分工.md\n  - 派工-多AI并行-2026-09-20/01-Codex-T5-T9-固件补丁.md\n  - 派工-多AI并行-2026-09-20/02-Claude-T6-T11-评审官.md\n  - 派工-多AI并行-2026-09-20/03-DeepSeek-T7-T8-时序与语义.md\n  - 派工-多AI并行-2026-09-20/04-豆包-T12-T2-赛规与流程.md\n  - 派工-多AI并行-2026-09-20/05-Grok-T4-接线单.md\n  - 派工-多AI并行-2026-09-20/06-ChatGPT-T1-T3-几何与诊断.md\n  - 派工-多AI并行-2026-09-20/99-总控汇总与第二轮复核模板.md\nresume_from: 收到第一个 AI 回复后，按\"一、汇总表\"填起\n```\n"}]}</script>
<script>
const DATA = JSON.parse(document.getElementById('data').textContent);

const $ = id => document.getElementById(id);
function toast(msg){

}

    const b = document.createElement('button');

    if (sent.has(f.name)) b.classList.add('sent');

    tick.className = 'tick'; tick.textContent = '✓';
    b.appendChild(tick);

    $('warn').appendChild(d);

  $('body').textContent = f.text;

function copy(text){
  // 1) 现代 API（file:// 下有时不可用，故有降级）
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(
      () => toast('已复制 ' + text.length.toLocaleString() + ' 字'),
      () => fallback(text)
    );
    return;
  }
  fallback(text);
  function fallback(t){
    const ta = document.createElement('textarea');
    ta.value = t;
    ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);

             : '复制失败，请在下方框内手动全选复制');
  }
}

$('btnCopy').onclick = () => copy(DATA.files[cur].text);

$('btnDl').onclick = () => {
  const f = DATA.files[cur];
  const blob = new Blob([f.text], {type: 'text/plain;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);

  setTimeout(() => URL.revokeObjectURL(a.href), 4000);

};

$('btnSent').onclick = () => {

};

// 键盘：← → 切换

  if (e.key === 'ArrowRight'){ cur = (cur + 1) % DATA.files.length; render(); }
  if (e.key === 'ArrowLeft'){ cur = (cur - 1 + DATA.files.length) % DATA.files.length; render(); }
});

render();
