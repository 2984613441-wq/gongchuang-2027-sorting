# ============================================================
# 相机标定配置文件 v1.0
# ============================================================
#
# 本文件定义 像素坐标 → 装置坐标(mm) 的换算参数
#
# 使用方法：
#   1. 执行九点标定（见 docs/plans-2026-09-16/W6-标定操作流程.md）
#   2. 计算仿射矩阵 6 个参数（用 numpy.linalg.lstsq 或手算）
#   3. 填入下面的 [CameraCalibration] 节
#   4. 运行 python 电控/src/electrical_control/rpi/pixel_to_device.py 自检
#   5. 九宫格反向验证（目标 RMS ≤ 2mm）
#
# ⚠️ 警告：
#   - 下面的参数都是 **占位值**，需实测后填入
#   - 未标定时所有像素→mm 转换返回 None（拒识所有物体）
#   - 标定错误会导致抓取偏移（送错盒 = 判负级错误）
#
# ============================================================

[CameraCalibration]
# 仿射变换矩阵参数（6 个）
# 公式：
#   x_mm = a11*u + a12*v + tx
#   y_mm = a21*u + a22*v + ty
# 其中 (u,v) 是像素坐标（bbox中心），(x,y) 是装置坐标（单位 mm）

# ⚠️ 下面都是占位值，需实测后替换
# —— 2026-09-18 粗标（机器未装配时用"物块推到托盘两端"实测得出）——
# 数据来源：树莓派只监听 MaixCAM（工具/pi_fov_probe.py），把件推到托盘两端：
#   X: 像素 57 ↔ -95.0mm ，像素 232 ↔ +95.0mm
#      → 比例 190mm/175px = 1.08571 mm/px，x=0 落在像素 144.5
#   Y: 像素 142 ↔ -97.5mm，像素 232 ↔ 0mm（托盘在 Y 负半轴）
#      → 比例 97.5mm/90px = 1.08333 mm/px，y=0 落在像素 232
# 两轴比例一致（1.086 vs 1.083）→ 镜无畸变、像素为方，可交叉验证。
#
# ⚠️ 精度约 ±5mm（手推到底的误差），够做演示，不够做精细抓取。
#    机器装回后须做正式九点标定替换本组值（工具/calib_photo.py 或 calib_grid.py）。
#
# 🔴 Y 的方向符号【未实测确认】：本组值假定"装置 +Y = 画面 v 增大方向"。
#    若机器首次运动时 Y 往反方向跑，把 a22 与 ty 同时取反即可：
#        a22 = -1.083333   ty = 251.333333
#    ⚠️ 反向会导致 Y 跑到另一侧半区（转盘侧），可能超程 —— 首测必须有人在旁边急停。
a11 = 1.085714
a12 = 0.0
tx = -156.886
a21 = 0.0
a22 = 1.083333
ty = -251.333

# 相机高度（镜头到标定平面（托盘面）的垂直距离，单位 mm）
# 实测值：镜头离地 475mm，托盘面离地 213mm → d = 262mm
# 用于高度视差补偿公式：scale = d/(d-h)
camera_height = 262.0

# 标定日期（记录用，不影响计算）
calibration_date = 未标定

# 标定人员（记录用）
calibrated_by = 待填


[ToolOffset]
# 工具链固定几何偏移（单位 mm），在 pixel_to_device 结果之后、下发 PICK 之前叠加。
# 来源（2026-09-19 用户实测）：
#   工具偏移 (-60, 0) + 滑台↔Z轴安装偏差 (-15, -25) = (-75, -25)
# 相机移动后只重标 [CameraCalibration]；机械关系未变时不要改本节。
# 旧配置没有本节时程序缺省 x_mm=0.0 / y_mm=0.0，保持向后兼容。
# ⚠️ 当前仓库 tx/ty 是旧的、已折入工具偏移的过期副本；必须等人工把 tx/ty 重标为
#    相机坐标→装置基准坐标后，再把本文件部署到 Pi，否则会把 (-75,-25) 重复补两次。
x_mm = -75.0
y_mm = -25.0


[ObjectHeights]
# 物体高度（单位 mm）
# 索引：box_id
# box_id = height_mm
#
# 高度用于【视差补偿】：件越高，顶面离相机越近，投影偏移越大。
#   补偿公式：scale = camera_height / (camera_height - object_height)
#   缺失或非法时**拒识该件**；只有显式配置 0 才表示"关闭补偿"。
#
# ═══════════════════════════════════════════════════════════════════════════
# 🔴 2026-10-26 用户裁决：**恢复 2026-09-22 的实测值**（不用常数 45）
#
#   历史：我先按"省赛没时间测"填了常数 45，后来发现 Pi 上原本就有
#   2026-09-22 实测的真实件高（正方体 40 / 三棱柱 32.5 / 圆柱 30），
#   实测值明显更准，故恢复。
#
#   为什么实测值比常数好（camera_height=262mm，托盘角距天底 127mm）：
#     视差位移 = [h/(262-h)] × 127
#       正方体 40mm：按 45 补 ⇒ 残余 **3.5mm**
#       三棱柱 32.5mm：按 45 补 ⇒ 残余 **7.8mm**
#       圆柱 30mm：按 45 补 ⇒ 残余 **9.9mm**
#     ⇒ 用实测值残余 ≈ 0。
#
#   ⚠️ 索引是 **box_id**（不是形状名）。当前 6 个 box 对应的是旧口径
#      （正方体×2 / 三棱柱×2 / 圆柱×2）。新赛规换成 6 形状后，
#      **需要重新对应一遍**（等视觉输出改成形状编号后再定）。
#   ⚠️ 这里**不能填 0** —— 填 0 = scale 恒为 1.0 = 完全不补偿，
#      托盘角上会偏 23~30mm。
# ═══════════════════════════════════════════════════════════════════════════
1 = 40.0  # 2026-09-22 实测件高（正方体）
2 = 40.0  # 2026-09-22 实测件高（正方体）
3 = 32.5  # 2026-09-22 实测件高（三棱柱）
4 = 32.5  # 2026-09-22 实测件高（三棱柱）
5 = 30.0  # 2026-09-22 实测件高（圆柱）
6 = 30.0  # 2026-09-22 实测件高（圆柱）


[WorkspaceLimits]
# 工作区限制（单位 mm，原点=装置中心）
# 超出此范围的物体会被拒识（返回 None）

# X 轴范围（2026-09-18 二次修正：用户用尺手工推量，X 总行程 19.0cm = 190mm，
#            原点取行程中心 → ±95.0mm）
# 同步方见 ec_motion_plan.h 的 EC_MOTION_REACH_LIMIT_X_MM10 = 950（负端，未动）
#                                  EC_MOTION_REACH_FAR_X_MM10   = 900（正端，2026-09-19 收紧）
# 🔴 旧值 ±105.0mm 系记录错误（当时把 X/Y 记反了），已作废：
#    X 被多算 20mm，导致固件放行了 200mm 的移动命令而 X 实际只有 190mm，
#    超出部分脉冲打在硬限位上 → 丢步 + 坐标基准失准。
# 🔴 2026-09-19「甲′」：可达域改为【非对称】。负端保持 -95.0（HOME 压线，不能动），
#    正端收到 +90.0，给远端留 5.0mm 机械余量 —— 防止实际行程比标称略短时顶死
#    （X/Y 无限位开关，超程无任何硬件能发现）。此处必须与固件同步，
#    否则会出现「固件已拒、视觉仍发」的口径分叉。
x_min = -95.0
x_max = 90.0

# Y 轴范围（2026-09-18 四次修正：机械组修复了 Y 末端阻挡，可达行程 +约15mm；
#            仍保留约 1.5cm 不可达 → 当前可达约 195mm，原点取行程中心 → ±97.5mm）
# 同步方见 ec_motion_plan.h 的 EC_MOTION_REACH_LIMIT_Y_MM10 = 975（负端，未动）
#                                  EC_MOTION_REACH_FAR_Y_MM10   = 925（正端，2026-09-19 收紧）
# 🔴 取保守侧：宁可少用 5mm，不可超程（超程会堵转并带挂主控）。
# 🔴 机械再次调整后必须重新实测再改。
# 🔴 2026-09-19「甲′」：同 X —— 负端 -97.5 不动，正端收到 +92.5。
y_min = -97.5
y_max = 92.5

# ============================================================
# 标定质量指标（记录用，不影响计算）
# ============================================================
#
# [CalibrationQuality]
# # 九宫格验证 RMS 误差（单位 mm）
# rms_error = 未验证
#
# # 单点最大误差（单位 mm）
# max_error = 未验证
#
# # 标定点数量
# calibration_points = 0
#
# ============================================================
