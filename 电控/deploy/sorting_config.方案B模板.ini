# ============================================================================
# 方案B 配置模板 —— 360° 转盘选格（1 个固定落点 × 6 个货格位置）
# 口径：ST-3215 总线舵机 · UART2 · 位置域 0~4095 · `pos:NNNN`（2026-11-07 用户定稿）
# ============================================================================
#
# 🔴 这是【模板】，不是生效配置。启用方法见文末"如何启用"。
# 🔴 下面 6 个 pos 值是**示例值**（2026-11-07 定稿的六格排布示例），
#    仅供 `--fake-link` 主机冒烟；**M1 没测完之前禁止拿去上机**——
#    位置值的真值只能来自现场 `measure_turntable_slots.py` 的实际读回。
#
# 为什么用 `pos:` 而不是角度（2026-11-07 复核结论）：
#   1. 角度是"相对第 1 格"，位置域是舵机**绝对坐标**，两者差一个绝对基准；
#   2. 舵机中位到边界只有 ±2048 counts（±180°），6 格 × 60° = 300° 张角
#      用角度表表达**必然越界**（实测 240°→-683、300°→-1365）；
#   3. 测量工具 `--read` 直接给 0~4095，`pos:` 少一层换算、少三个标定常数。
#
# ⚠️ `[TurntableAngles]` 同一段里**禁止混用** `pos:` 与角度：
#    混用 ⇒ `SystemExit`（fail-closed，见 drop_strategy.py）。
#    旧 270° 角度写法仍可用（旧模板见 `sorting_config.方案B模板-270deg.ini`）。
# ============================================================================

[TurntableAngles]

# ─── 固定落料点（滑台记账坐标，单位 mm，装置中心为原点）──────────────
# 【占位·未测】真值来自 `工具/measure_drop_point.py`，M2 测完改成实测值。
turntable_drop_point = 88.0, 90.0

# ─── 6 个货格位置值（0~4095，舵机绝对坐标）────────────────────────────
# 真值来源：`python3 /home/pi/measure_turntable_slots.py --interactive --out /home/pi/tt_slots.ini`
# 下面的值只是**排布示例**（6 格在 4096 counts 上等分），不是现场真值：
#   格1 2048 / 格2 1365 / 格3 683 / 格4 0 / 格5 3413 / 格6 2731
# 判据：相邻两格差应接近 4096/6 ≈ 683 counts（≈60°）；偏差过大先查机械分度/皮带打滑。
1 = pos:2048
2 = pos:1365
3 = pos:683
4 = pos:0
5 = pos:3413
6 = pos:2731

# ============================================================================
# 如何启用（三步，缺一不可）
# ============================================================================
#
# 【第 1 步】现场测 M1（6 格位置值）+ M2（单一落点坐标），得到 tt_slots.ini
#   SOP：`docs/现场测量-转盘六格与单落点-20261106.md` §2/§3
#
# 【第 2 步】把 `[TurntableAngles]` 整节合并进设备上的 `/home/pi/sorting_config.ini`
#   ⚠️ 不要整文件替换 —— 那个文件还有 [Vision]/[Motion]/[Network]/[PickPoint]/[BoxMap]。
#   a) 注释掉/删掉 [TurntablePositions] + [TurntableSides]（方案C 的节；留着虽不生效，
#      但改日误改风险高）
#   b) 粘贴本文件的 [TurntableAngles]（内容用第 1 步的实测值替换示例值）
#   c) [DropPoints] 可保留（方案B 不用；run_chain 启动期的 [BoxMap] 交叉检查会读它）
#
# 【第 3 步】验证
#   cd /home/pi/电控 && PYTHONPATH=src python3 -c "
#   from electrical_control.rpi.drop_strategy import load_strategy_from_config
#   s = load_strategy_from_config('/home/pi/sorting_config.ini')
#   print(type(s).__name__)            # 应输出 TurntableStrategy
#   print(s.uses_position_domain())    # 应输出 True
#   print(s.get_drop_point(1))         # 应输出 (880, 900) 之类
#   for b in range(1,7): print(b, s.get_position(b))
#   "
#   期望：TurntableStrategy / True / 六格位置值全非 None
#
# 【回退】把 [TurntableAngles] 整节删掉、恢复 [TurntablePositions]+[TurntableSides] 即回方案C；
#        或恢复旧的 270° 角度模板 `sorting_config.方案B模板-270deg.ini`。
#
# ============================================================================
# 启用后代码怎么走（供核对）
# ============================================================================
#   drop_strategy.py  load_strategy_from_cfg：has_section("TurntableAngles") ⇒ 方案B；
#                     逐值识别 `pos:` 前缀；混用/缺格/越界 ⇒ SystemExit
#   run_chain.py      方案B：实例化 Turntable(make_backend()) + PositionTurnGuard；
#                     删掉了 2026-10 的"方案B 未接线 ⇒ 拒绝启动"保护
#   turntable.py      pos_for_box() 优先 pos_table；command_box_position() 直发 0~4095
#   turntable_position_guard.py
#                     |read_pos()-target| ≤ 20 counts 判到位；超时/读不到 ⇒ 锁死停链
#
# ⚠️ 生产跑方案B 时 class_id 是 `code`（1..30）而不是货格号 ⇒ 必须
#    `--slot-mode dynamic`（动态分配把 code 映射成 box_id）；否则启动即拒。
# ============================================================================

# ============================================================================
# 【可选】[Turntable] 段：现场覆盖转盘时序/到位判据（不写则用代码默认值）
# ============================================================================
