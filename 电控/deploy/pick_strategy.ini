# ============================================================================
# 2026-11-01 新增：五键排序（--order-mode=five_key）参数
# ============================================================================
# 这些参数**不在本 ini 里读取**（本 ini 是 fail-closed 的逐行来源标注格式，
# 加新键会让旧 ini 解析失败）；它们由 run_chain 的 CLI/环境变量提供：
#
#   --order-mode legacy|group|difficulty|open_edge|five_key   （环境变量 ORDER_MODE）
#   --settle-frames N       停稳判据：连续 N 帧位置不变（环境变量 SETTLE_FRAMES，默认 3）
#   --settle-shift-mm X     停稳判据：中心位移阈值 mm（环境变量 SETTLE_SHIFT_MM，默认 4）
#   隔离度环带 = max(夹爪包络半宽) + 10 mm（代码内常量，见 orderer.DEFAULTS）
#
# 【待实测】：停稳帧数/位移阈值尚未在实机标定，当前 3 帧 / 4 mm 为估计值。
# 回退：--order-mode=group（= 接入前的现状口径）或 --pick-strategy=off。
