# ============================================================================
# 夹取策略配置 —— 【实机】版本（fail-closed）
# ============================================================================
#
# 用途：实机接入前先把它补成"全部有实测值"的配置；在补全之前，
#       `run_pick_strategy.py --strict` 会拒绝出计划。
#
# 🔴 本文件与 `pick_strategy.demo.ini` 的区别：
#    本文件里凡是**没有实测依据**的量，都标【待实测】，并把
#    `[Tray] require_gap_geometry` 设成 true（缝隙几何未实测 ⇒ 一件都不做）。
#
# 来源标签含义（每个 `键 = 值` 行都必须带一个，缺了加载器直接报错）：
#   【实测】     已由实测、或对代码/文档的只读核对确认的值
#   【固件常量】 取自固件源码里的编译期常量（带文件:行号）
#   【演示】     为跑通离线示例而假设的值 —— 不是测量结果
#   【待实测】   已知必须实测但还没有值；程序会把它列进"未核实参数"清单
# ============================================================================

[Workspace]
x_min = -95.0      # 【固件常量】ec_motion_plan.h:94
x_max = 90.0       # 【固件常量】ec_motion_plan.h:126
y_min = -97.5      # 【固件常量】ec_motion_plan.h:106
y_max = 92.5       # 【固件常量】ec_motion_plan.h:127

[Home]
# ⚠️ 用户需求二写"返回右上方初始位置"，而固件 HOME 是负方向最里角。
#    该矛盾未裁决（矛盾清单 C-2）；此值必须等于固件 HOME，否则一律不可执行。
x_mm = -95.0       # 【固件常量】ec_motion_plan.h:193
y_mm = -97.5       # 【固件常量】ec_motion_plan.h:194

[Tray]
# 🔴 托盘实域**未实测**（机械/drawings/ 与 机械/specs/ 目前为空目录）。
#    下面四个值只是"可达域占位"，**禁止**直接用于实机几何判断。
x_min = -95.0      # 【待实测】占位 = 可达域下限
x_max = 90.0       # 【待实测】占位 = 可达域上限
y_min = -97.5      # 【待实测】占位 = 可达域下限
y_max = 62.5       # 【待实测】唯一有依据的线索：自 HOME 起算 160mm（pi_bench_goto.py:31-35）
open_side = y_max  # 【实测】2026-09-21 用户现场确认：**X 轴全部被挡住，只有 Y 正方向敞开**
gap_known = false  # 【待实测】缝隙几何未实测
require_gap_geometry = true   # 【实测】需求四.6：不得默认缝隙可通行 → 未实测即不做
# 按行分桶的 y 容差（mm）：差 ≤ 本值算"同一排"，排内按 X 升序抓（先最靠 −X 那件）。
# 【实测】2026-09-22 现场：同一帧内同排 y 散布 max−min = 4.3/3.8/3.4/3.4/2.9mm
#        （另一处场合的链帧 5.6mm）；同一件帧间抖动 ≤1.4mm；操作员排间距 ≥50mm。
# 【历史】15.0 →（round-R8-082944 判别轮实测"操作员自认同排两件 y 差 14.7mm"）→ 17.0
# 🔴🔴 2026-09-22 用户现场裁决：17.0 → **20.0**（用户口径："先定两厘米"）
#     理由：要让"正方体-圆柱-正方体 挤在一起"的三件算**同一排**，排内才好按 −X 优先。
#     ⚠️⚠️ 同时必须记下**两条已知代价**（实测/推算，别当成已经解决）：
#       (a) 20.0 会与"两排的最小间距"撞车：本文件既有夹具语料里 |30−10| = 20mm 就是两排
#           （所以离线夹具 pick_strategy.demo.ini 仍保持 17.0，避免语料被并排；值不一致是有意的）。
#       (b) 现场实测过**相邻排只差 17.3mm** 的一帧（round-R8-093310）⇒ 20.0 会把那种"真两排"并排 ✗。
#     ⚠️ 并且它**治不了**今天用户举的例子：实测那次的"黑圆柱"比两个正方体高 **24.9mm**
#        （> 20）⇒ 仍是两排 ⇒ 圆柱仍会第一个被抓（这不是排序器 bug，是摆放本身如此）。
#        要它仨算一排需 ≥25mm，而 (b) 说明 ≥25 会并排 ⇒ **正解是摆放纪律（同排 y 差压到 ~2cm 内）
#        或改成"按最大 y 间隙切排"（无魔法数、自适应）**，见交接文件 §10.10.1 的取值历史。
#     0 = 关闭分桶（退回旧行为：只认 y 完全相等）。
row_tolerance_mm = 20.0       # 【实测】2026-09-22 用户现场裁决 17.0→20.0（代价与局限见上 5 行）
                              # ⚠️ 标签只能是 实测/固件常量/演示/待实测 之一；写【现场裁决】会 ConfigError
                              #    而 chain_adapter 会吞掉该异常 ⇒ 排序器静默失效（2026-09-22 踩过一次）

[ToolOffset]
# ⚠️ 与台账 §10.4.3 记的 (−75,−25) 冲突（台账 :637），矛盾清单 C-3。
# 🔴 2026-09-22 修正：本值必须与**真正生成 PICK 的那一份**同源，即 Pi 上
#    /home/pi/电控/calibration_config.ini 的 [ToolOffset]（现值 = (−108.5, −20.5)，
#    见该文件 :186-187，是 3 点标定闭环解出的真值；同日两次"补偿"均已撤回）。
#    旧值 (−120.5,−43.5) 是 2026-09-19 的五样本均值，其后标定闭环改过两次
#    （x: −111.5→−108.5；y: −29.5→−20.5）而本文件没跟上 ⇒ 于是
#    chain_adapter._device_coords() 打印的「排序输入（装置坐标）」整体偏
#    (+12.0, +23.0)mm ⇒ **不能与 p_look2 的坐标对差**。实测逐位吻合：
#    青 +11.6/+23.0、蓝 +12.5/+23.0（round-R8-093310 与同轮 p_look2 对比）。
#    ⚠️ 本次改动【行为中性】，只让日志坐标变成真值：链上所有检查都是
#       "减了再加回去"的往返（chain_adapter.py:76 减、selector.py:188 加回、
#       config.object_window = workspace − tool_offset 同步平移）⇒ 排序与过滤均不变。
#    ⚠️ deploy/pick_strategy.demo.ini 保留旧值：它是离线夹具，多个 host 用例
#       直接钉住了由旧值推出的 (25.5,210.5)/(−54.0,136.0)，改它只会改测试期望。
x_mm = -108.5      # 【实测】calibration_config.ini:186（标定闭环真值；2026-09-22 对齐）
y_mm = -20.5       # 【实测】calibration_config.ini:187（同上）

[Gripper]
envelope_mm = 25.0, 25.0   # 【待实测】夹爪完整外形从未实测（ec_axis_driver.h:58）

[Motion]
max_size_mm = 20.0, 20.0        # 【实测】赛规货物 ≤40mm（27年工创.pdf 第11页）
exit_clearance_mm = 10.0        # 【待实测】退出定位余量，需按夹爪/定位精度实测
empty_travel_may_cross_tray = true  # 【演示】依据需求一.4；⚠️ 与固件现状冲突（矛盾清单 C-1）

[Feedback]
step_timeout_s = 12.0     # 【待实测】必须 < 固件 15s 窗口（ec_app.c:553）
step_duration_s = 2.0     # 【演示】离线模拟器用；实机接入后此值无意义
assume_grasp_without_fault = false  # 【实测】没有夹持传感器 ⇒ 实机按"未证实即停"更保守
retain_grasp_on_fault = true        # 【实测】需求五.7

[Vision]
selection_mode = center   # 【实测】现有 BATCH_TARGETS 无宽高/轮廓
stale_frame_timeout_s = 3.0        # 【待实测】
empty_confirmation_frames = 3      # 【待实测】需求五.9 要求"连续多个"

[Drop]
