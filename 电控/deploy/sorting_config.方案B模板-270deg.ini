# ============================================================================
# 方案B 配置模板 —— 转盘选格（1 个固定落点 × 6 个货格角度）
# ============================================================================
#
# 🔴 这是【模板】，不是生效配置。启用方法见文末"如何启用"。
#
# 为什么单独放一个文件、而不直接改 sorting_config.ini：
#   drop_strategy.py:306 的判定是
#       if cfg.has_section("TurntableAngles"):   → 方案B
#       elif cfg.has_section("TurntablePositions"): → 方案C
#       else:                                     → 方案A
#   ⇒ 只要 [TurntableAngles] 一出现，**立刻从方案C 切到方案B**。
#   而 6 个角度还没标定过，贸然切换会让整条链投错格。
#   ⇒ 所以做成独立模板，标定完成后再手工合并。
#
# 生成日期：2026-10-23
# 依据：docs/reports/2026-10-22-T6-转盘角度设计-方案B-Claude.md
# ============================================================================

[TurntableAngles]

# ─── 固定落料点（滑台记账坐标，单位 mm，装置中心为原点）──────────────
# 2026-10-22/23 实测：这是 X/Y 的最远行程位置（X 走 14800 步 = 185.0mm、
# Y 走 14880 步 = 186.0mm，从 HOME 起算），换算装置坐标 = (+90.0, +88.5)。
# ⚠️ 用户原话："这不是落点，是我们 X、Y 的最远行程大概的距离……我们到时候的
#    落点可能也大概就是在这个位置，就是我们先暂定这个位置。"
# ⇒ 暂定值，最终落点现场微调后改这里。
turntable_drop_point = 90.0, 88.5

# ─── 6 个货格角度（度）────────────────────────────────────────────────
#
# 舵机规格（同落料舵机）：MG996R，量程 ≈270°
#   中位 1500µs，每 90° = 655µs  ⇒  1° = 7.2778µs
#   换算：pulse_us = 1500 + angle_deg × 655 / 90
#
# 🔴 为什么是 ±112.5° 而不是等分 360°：
#   6 格等分 360° 需要每格 60°，跨度 300°，而 MG996R 只有 270° ⇒ 覆盖不了。
#   270° 内放 6 格 ⇒ 每格间隔 45°，围绕中位对称 ⇒ [-112.5 … +112.5]。
#
# 脉宽核算（全部落在 500~2500µs 安全区内）：
#   角度      脉宽      计算
#   -112.5    681 µs    1500 - 112.5×7.2778 = 1500 - 818.75
#    -67.5   1009 µs    1500 - 491.25
#    -22.5   1336 µs    1500 - 163.75
#    +22.5   1664 µs    1500 + 163.75
#    +67.5   1991 µs    1500 + 491.25
#   +112.5   2319 µs    1500 + 818.75
#
# ⚠️⚠️ 以下三条全部【未标定】，启用前必须现场确认：
#   ① 0°（1500µs）对应的物理位置是不是"货格1对准落料口"
#   ② 顺时针为正 还是 逆时针为正（与 turntable.py 的 angle_sign 有关）
#   ③ 货格编号 1~6 与实际物理格位的对应（哪个格子装哪类件由 [BoxMap] 决定）
#
# 标定方法（每格一步）：
#   1. 发 `SPEED` 无关 —— 转盘走 turntable.py 的后端，不是 STM32 步进
#   2. 用 python3 电控/src/electrical_control/rpi/turntable.py 或
#      PwFileBackend 直写 /home/pi/pw.txt 一个脉宽，看转盘转到哪个格
#   3. 记录"该格对准落料口时的脉宽" ⇒ 反算角度 ⇒ 填下表
#   4. 六格全填完、确认无碰撞，再按"如何启用"合并进 sorting_config.ini
#
# ✅ 2026-10-23 起，**行内注释是安全的**：本项目所有 ConfigParser 已统一加
#    `inline_comment_prefixes=("#",)`（见 drop_strategy.py:292 的说明）。
#    历史（修复前的坑）：configparser 默认不剥注释，写 `1 = -112.5  # 注释`
#    会让该值解析失败并被**静默跳过**，最后只报"缺货格 [1..6]"而看不出真因。
#
# 对应脉宽（1500 + 角度×655/90）：
#   格1 -112.5° → 681µs    格2 -67.5° → 1009µs   格3 -22.5° → 1336µs
#   格4  +22.5° → 1664µs   格5 +67.5° → 1991µs   格6 +112.5° → 2319µs
1 = -112.5   # 脉宽 ≈ 681 µs  ← 待标定确认
2 = -67.5    # 脉宽 ≈ 1009 µs ← 待标定确认
3 = -22.5    # 脉宽 ≈ 1336 µs ← 待标定确认
4 = 22.5     # 脉宽 ≈ 1664 µs ← 待标定确认
5 = 67.5     # 脉宽 ≈ 1991 µs ← 待标定确认
6 = 112.5    # 脉宽 ≈ 2319 µs ← 待标定确认


# ============================================================================
# 如何启用（三步，缺一不可）
# ============================================================================
#
# 【第 1 步】现场标定 6 个角度
#   上面 ① ② ③ 三条全部确认后，把上表 6 行改成实测值。
#   若发现方向相反（顺时针为负），直接把 6 个角度取负即可（脉宽对称）。
#
# 【第 2 步】在 Pi 的 /home/pi/sorting_config.ini 里合并
#   ⚠️ 不要直接替换文件 —— 那个文件还有 [Vision]/[Motion]/[Network]/
#      [PickPoint]/[TurntableSides]/[BoxMap] 等节，删了整条链就起不来。
#   做法：
#     a) 先把 [TurntablePositions] 整节**注释掉或删掉**
#        （否则虽然方案B 优先，但留着容易日后误改）
#     b) 把本文件的 [TurntableAngles] 整节粘贴进去
#     c) 保留 [TurntableSides]（方案B 不用，但留着无害）
#     d) 确认 [DropPoints] 仍在（方案B 的 uses_drop_points() 返回 False，
#        但 run_chain 启动期的 [BoxMap] 交叉检查会用到它）
#
# 【第 3 步】验证
#   cd /home/pi/电控 && PYTHONPATH=src python3 -c "
#   from electrical_control.rpi.drop_strategy import load_strategy_from_config
#   s = load_strategy_from_config('/home/pi/sorting_config.ini')
#   print(type(s).__name__)          # 应输出 TurntableStrategy
#   print(s.get_drop_point(1))       # 应输出 (900, 885)
#   for b in range(1,7): print(b, s.get_angle(b))
#   "
#   期望：TurntableStrategy + 六格角度全非 None
#
# 【回退】把 [TurntableAngles] 整节删掉、恢复 [TurntablePositions] 即回方案C。
#
# ============================================================================
# 启用后的代码路径（供核对）
# ============================================================================
#   drop_strategy.py:306  方案判定（has_section("TurntableAngles")）
#   drop_strategy.py:308  缺 turntable_drop_point ⇒ SystemExit（fail-closed）
#   drop_strategy.py:324  读 1~6 角度，非数字项静默跳过
#   drop_strategy.py:335  缺任一格 ⇒ SystemExit（fail-closed，不会静默降级）
#   drop_strategy.py:104  get_drop_point() → 六格返回同一坐标
#   drop_strategy.py:116  get_angle()      → 返回该格角度
#   drop_strategy.py:123  uses_drop_points() → False
#
# ⚠️ 转盘动作本身由 run_chain 调 turntable.py 完成（三种后端：
#    PwFileBackend / PigpioBackend / SerialServoBackend），见
#    docs/reports/2026-10-23-T6-* 与 turntable.py 的头部说明。
#    本模板只解决"角度表"这一件事，不解决"转盘怎么被驱动"。
# ============================================================================
