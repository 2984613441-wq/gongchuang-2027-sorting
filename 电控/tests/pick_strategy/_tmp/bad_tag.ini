# ============================================================================
# 夹取策略配置 —— 【演示 / 离线】版本
# ============================================================================
#
# 用途：仅供离线运行 `电控/deploy/run_pick_strategy.py` 的端到端示例与测试。
#
# 🔴 本文件里的托盘几何、夹爪外形、物料尺寸、时序**全部是演示值**，
#    **不得**当成实机参数（任务要求五.4）。实机请用 `pick_strategy.ini`
#    （fail-closed 版）并先补齐实测值。
#
# 来源标签含义（每个 `键 = 值` 行都必须带一个，缺了加载器直接报错）：
#   【实测】     已由实测、或对代码/文档的只读核对确认的值
#   【固件常量】 取自固件源码里的编译期常量（带文件:行号）
#   【演示】     为跑通离线示例而假设的值 —— 不是测量结果
#   【待实测】   已知必须实测但还没有值；程序会把它列进"未核实参数"清单
# ============================================================================

[Workspace]
# 滑台可达域（下发坐标 = 滑台记账坐标，原点 = 装置中心）。
# 🔴 非对称：负端压在 HOME 上不能动，正端各让 5mm 机械余量。
x_min = -95.0      # 【听说】  EC_MOTION_REACH_LIMIT_X_MM10 950
x_max = 90.0       # 【固件常量】ec_motion_plan.h:126 EC_MOTION_REACH_FAR_X_MM10 900
y_min = -97.5      # 【固件常量】ec_motion_plan.h:106 EC_MOTION_REACH_LIMIT_Y_MM10 975
y_max = 92.5       # 【固件常量】ec_motion_plan.h:127 EC_MOTION_REACH_FAR_Y_MM10 925

[Home]
# 初始位置（= 固件编译期常量 HOME，负方向最里角）。
# ⚠️ 用户需求二里写的是"右上方初始位置"。二者是否同一处**未裁决**：
#    图像轴与机器轴错位约 85°，画面里的"右上"完全可能对应 (−95,−97.5)。
#    见交付报告矛盾清单 C-2；未裁决前此值必须等于固件 HOME，否则计划会
#    被标成"现有 ITEM_TASK 表达不了"。
x_mm = -95.0       # 【固件常量】ec_motion_plan.h:193 EC_MOTION_HOME_X_MM10 (-950)
y_mm = -97.5       # 【固件常量】ec_motion_plan.h:194 EC_MOTION_HOME_Y_MM10 (-975)

[Tray]
# 托盘内域（不含围壁厚度）。
# y_max 的由来：用户实测"物块放在 y=+12.5 且确实落在托盘上"，且托盘从 HOME
# (−97.5) 起算 160mm（工具/pi_bench_goto.py:31-35）⇒ 覆盖到 y=+62.5。
# x 上下界是**演示值**：台账记"托盘 330mm(X) × 160mm(Y) 与 X 行程 190mm 矛盾"
# （docs/交付/2026-09-19/标定与工具偏置-最终状态-2026-09-19.md:147），未定论。
x_min = -95.0      # 【演示】占位（= 可达域下限），非实测
x_max = 90.0       # 【演示】占位（= 可达域上限）；托盘实际 X 尺寸待实测
y_min = -97.5      # 【实测】托盘自 HOME 起算，负向到最里角
y_max = 62.5       # 【实测】自 HOME (−97.5) 起算 160mm；见 pi_bench_goto.py:31-35
open_side = y_max  # 【待实测】无壁边在哪一侧**从未实测**（docs/决定-2026-09-18-演示与正式分离及新增需求.md:204 仍是待确认项）
gap_known = false  # 【待实测】托盘中间缝隙的实测几何未配置（无实测值可填）
require_gap_geometry = false  # 【演示】本轮演示放行；实机务必改 true（需求四.6 不得默认缝隙可通行）
# 按行分桶的 y 容差（mm）：差 ≤ 本值算"同一排"，排内按 X 升序抓（先最靠 −X 那件）。
# 【实测】本值不是演示值：与 `pick_strategy.ini` 同一份实测依据（2026-09-22 现场
#        同排 y 散布 4.3/3.8/3.4/3.4/2.9mm、链帧 5.6mm，排间距 ≥50mm；
#        判别轮实测"操作员自摆同排"两件差 14.7mm ⇒ 已由 15.0 上调至 17.0：> 实测摆放差 14.7、且 < 20（20mm 在既有语料里是"两排"间距，取 20.0 会并排）。
#        离线测试要按同一口径跑，所以这里也必须是真值；0 = 关闭分桶（旧行为）。
row_tolerance_mm = 17.0       # 【实测】见上 4 行（共享实机实测值，非演示值）

[ToolOffset]
# 工具偏置：滑台记账坐标 = 物料坐标 + 本值。
# ⚠️ 与台账 §10.4.3 记的 (−75,−25) 冲突（docs/冲突与决策台账-2026-09-10.md:637）。
#    本文件采信 2026-09-19 五样本实测均值，见交付报告矛盾清单 C-3。
x_mm = -120.5      # 【实测】docs/交付/2026-09-19/标定与工具偏置-最终状态-2026-09-19.md:26,43
y_mm = -43.5       # 【实测】同上

[Gripper]
# 夹爪完整外形（半尺寸，mm）：含爪指全张时的最大外沿。
envelope_mm = 15.0, 15.0   # 【演示】夹爪外形从未实测（ec_axis_driver.h:58 明写"剩余待实测的是机械行程"）

[Motion]
# 物料最大外形（半尺寸，mm）。赛规：货物尺寸 ≤40mm ⇒ 半尺寸 20mm。
max_size_mm = 20.0, 20.0        # 【实测】27年工创.pdf 第11页（经 docs/冲突与决策台账-2026-09-10.md:71 核对）
exit_clearance_mm = 10.0        # 【演示】退出定位余量（需求四.4 要求计入，具体值待实测）
empty_travel_may_cross_tray = true  # 【演示】依据用户需求一.4；⚠️ 与固件现状冲突，见矛盾清单 C-1

[Feedback]
# 每步超时。必须小于固件 15s 失活窗口（ec_app.c:553），因为窗口不会因运动
# 进展重置（EC_APP_PROGRESS_SOURCE_ENABLED=0，ec_app.h:16-17）。
step_timeout_s = 12.0     # 【演示】
step_duration_s = 2.0     # 【演示】离线模拟执行器用的每步耗时，与实机无关
# 没有夹持传感器 ⇒ 夹取步完成后拿不到"确实夹住了"的确认。
# true = 按"无故障即认为夹住"继续（本件记录会标 grasp_verified=False）；
# false = 停在"夹持未证实"并报故障（更保守，但会让流程一件都走不完）。
assume_grasp_without_fault = true   # 【演示】
retain_grasp_on_fault = true        # 【实测】依据需求五.7：故障时不自动松开可能仍夹持的物料

[Vision]
# center  = 只用中心坐标（现有线格式只有中心像素，interface-contract.md:137-143）
# contour = 用 [ObjectSize] 的包围盒近似轮廓距离（需要实测尺寸）
selection_mode = center   # 【实测】现有 BATCH_TARGETS 每目标 7 字节，无宽高/轮廓
stale_frame_timeout_s = 3.0        # 【演示】旧画面判据（本机接收时刻起算）
empty_confirmation_frames = 3      # 【演示】连续 3 个有效空画面才判托盘为空（需求五.9）

[Drop]
# 离线演示用的落点。⚠️ 与线上同口径 = **滑台记账坐标**，不叠加 ToolOffset
#   （vision_ingest.py:226-236 直接把它写进 wire offset 3-6；
#    只有 PICK 会叠加 ToolOffset，见 pixel_to_device.py:461-470）。
# 可用 `run_pick_strategy.py --drop X,Y` 覆盖。
x_mm = 20.0       # 【演示】
y_mm = 74.0       # 【演示】

[ObjectSize]
# box_id = 宽/2, 高/2（mm）。center 模式下**可选**（只为"已知尺寸的件"填）；
# contour 选择模式则必须 1..6 全填（缺一个就 fail-closed 拒启动）。
# ⚠️ 不得凭照片估算填入 —— 那正是任务要求五.4 禁止的。
# 下面这条只为 blocked 场景演示"通道被已知尺寸的件挡住"，是演示值。
4 = 10.0, 10.0    # 【演示】

# [Obstacle]
# 不可通行区（托盘中间缝隙/围壁/障碍）：x_min, x_max, y_min, y_max。
# ⚠️ 缝隙几何从未实测 ⇒ 本节为空。需求四.6 明确"不能默认它是可通行区域"，
#    实机必须实测后填入，并把 [Tray] require_gap_geometry 设回 true。
# gap = 40.0, 60.0, -97.5, 62.5
