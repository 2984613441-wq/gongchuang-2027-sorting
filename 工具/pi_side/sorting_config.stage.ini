[Vision]
# MaixCAM视觉参数
# [PLACEHOLDER - 待实测标定]
# confidence_threshold: YOLO置信度阈值（0.0-1.0）
#   - 值越高：误检越少，但漏检越多
#   - 值越低：漏检越少，但误检越多
#   - 现场调试时根据实际物料调整
#   - 2026-09-15 用户裁决：统一为 0.5
#     （与 MaixHub 导出包 conf_th=0.5、commit ade707b4 一致；原 0.3 作废）
confidence_threshold = 0.5

# iou_threshold: NMS去重阈值（0.0-1.0）
#   - 值越高：保留更多重叠框（可能重复检测）
#   - 值越低：更激进去重（可能漏检）
#   - 通常保持0.45即可
iou_threshold = 0.45

# model_path: YOLO模型路径（MaixCAM上的绝对路径）
model_path = /root/my_models/model_8766.mud

[Motion]
# STM32运动参数
# [PLACEHOLDER - 待实测标定]
# 所有乘数参数：1.0 = 100%，0.8 = 80%，1.2 = 120%

# x_speed_multiplier: X轴速度倍率（0.5-2.0）
#   - 标定后EC_AXIS_MOVE_FREQUENCY_HZ × 该乘数 = 实际频率
#   - 用于现场快速调速，无需重新编译固件
x_speed_multiplier = 1.0

# y_speed_multiplier: Y轴速度倍率（0.5-2.0）
y_speed_multiplier = 1.0

# acceleration_factor: 加速度因子（0.5-2.0）
#   - 影响启动/停止的平滑度
#   - 值越大：加速越快，但可能丢步
#   - 值越小：更平滑，但总时间增加
acceleration_factor = 1.0

# max_speed_limit: 最大速度限制（Hz，绝对上限）
#   - 硬件安全红线，防止现场误调超限
#   - 即使speed_multiplier=2.0，也不会超过此值
max_speed_limit = 5000

# ========== [Timeout] 节已删除（2026-09-18，配置文件收口）==========
# 原 single_item_timeout_s=13 / total_round_timeout_s=180 在本仓库全部 .py 中
# **零引用**（台账 E-31：改了不生效，属"假配置"），故删除本节，避免现场误以为
# 已生效。超时的真实权威（单一来源，改 ini 无效）：
#   - 赛规 15 秒失活监控：固件 App/Src/ec_app.c（>= 15000ms，台账 E-09）
#   - ITEM_TASK 重传超时 5s：deploy/run_chain.py:893 task_timeout_s=5.0
#     （5s 无 MOTION_DONE/ITEM_RESULT → 重传，见 run_chain.py:943/946/958）
# 如需调整：改固件常量（L4 评审）或 run_chain.py 内常量。
# 关联登记：docs/冲突与决策台账-2026-09-10.md §9 E-31

[Safety]
# 安全参数（只读，现场不允许修改）
# 这些参数由STM32固件控制，配置文件仅作记录

# emergency_stop_enabled: 急停功能（固定启用）
emergency_stop_enabled = true

# limit_switch_check: 限位检查（值 = 只读记录，现场不允许修改，属 L4）
#   - 2026-09-15 用户裁决：**X/Y 不装限位开关** → false
#   - ✅ 2026-09-18 只读复核：固件 ec_startup_sequence.c 已于 2026-09-16 按同一
#     裁决移除全部限位检查 —— 文件头 :12 明写"不再检查任何限位输入
#     （X_HOME/X_END/Y_HOME/Y_END/Z_UP/Z_DOWN）"；POST 自检仅查 ESTOP + 电源许可
#     （:123-135）；HOMING 改为"上电位置即原点"、不做寻零运动（:159-168）。
#     原"置 false 后上电会 POST 失败进入 FAULT_LOCK"的警告**已解除**（旧行号
#     :124-126/:158-171 对应的是 2026-09-15 之前的固件）。
#     关联登记：docs/冲突与决策台账-2026-09-10.md §2.2 E-05、§9 E-27。
limit_switch_check = false

# workspace_limit_mm: 坐标域边界（2026-09-15 用户裁决后必须区分两个域）
#   1) 协议合法域 ±145mm —— interface-contract §5.2 冻结的 wire 边界（改它属 L4）
#   2) 机械可达域 ±82.5mm —— 165mm【全程】的一半（原点=装置中心）
#   ⚠️ 交付命令必须落在两者交集内，实际以 82.5 生效。
#      只按 145 放行会向物理够不到的坐标发脉冲，而 X/Y 已不装限位，无硬件能发现。
workspace_limit_x_mm = 145
workspace_limit_y_mm = 145

# reach_limit_mm: 机械可达域（165mm 全程的一半）
#   - 2026-09-15 用户裁决：165mm 为全程，故单侧 82.5mm
#   - 落点表必须填在此范围内，且保留 ≥5mm 余量
#   - 注：方案 A 靠人工摆中心建立原点，摆偏直接吃掉余量
reach_limit_mm = 82.5

[Calibration]
# 标定参数（记录用，实际值在STM32固件中）
# [PLACEHOLDER - 待实测标定]

# steps_per_mm_x: X轴步距比（steps/mm）
#   - 2026-09-15 用户裁决：**80**（原 100 作废）
#   - 依据：单腿行程 165mm = 13200 步 → 13200/165 = 80
#   - 传动：GT2 20 齿同步带 + 16 微步
#   - 已同步写入固件 App/Inc/ec_axis_driver.h EC_AXIS_STEPS_PER_MM_X/Y
steps_per_mm_x = 80

# steps_per_mm_y: Y轴步距比（steps/mm）
steps_per_mm_y = 80

# travel_per_leg_mm: 单腿行程（HOME → 单侧末端），2026-09-15 用户裁决为准
travel_per_leg_mm = 165

# 标定日期（记录最后一次标定时间）
#   注：steps_per_mm 与行程仍属"理论/逼近值"，卡尺实测后须回改此处与固件
last_calibration_date = 2026-09-15

[Network]
# 网络配置（树莓派 ↔ MaixCAM / STM32）

# maixcam_host: MaixCAM的IP地址
#   - 默认：MaixCAM作为热点，树莓派连接
#   - 如果网络拓扑变化，修改此值
maixcam_host = 172.20.10.2

# maixcam_port: MaixCAM监听的TCP端口
maixcam_port = 8765

# stm32_port: STM32的串口设备
# 🔴 2026-09-18 修正：实机为 /dev/serial0（→ ttyS0，GPIO14/15）。
#    原值 /dev/ttyUSB0 是错的 —— 树莓派与 STM32 走 GPIO 串口，不是 USB 转串口。
stm32_port = /dev/serial0

# stm32_baudrate: STM32串口波特率
stm32_baudrate = 115200

[DropPoints]
# 3 个固定落点 × 转盘 2 个方向（A/B 两组共用同样 3 个滑台坐标）
# 坐标 = 滑台记账坐标 mm；物理位置 = 本值 + (120.5, 43.5)
# 4/5/6 与 1/2/3 同坐标：靠转盘翻 180° 落到另一侧的物理格
# 🔴 2026-09-21 现场实测（板子复位后全程只向正方向走，每段 STEP_RESULT=1）：
#    ① 距 HOME (+7.0, +18.5) cm   ② (0.0, +14.5) cm   ③ (+14.0, +14.5) cm
1 = -43.0, 87.5
2 = -95, 47.5
3 = 45, 47.5
4 = -43.0, 87.5
5 = -95, 47.5
6 = 45, 47.5
[PickPoint]
# 固定抓取点（单位 mm，原点 = 装置中心）。
#
# 🔴 2026-09-18 用户裁定：**每次把物块放在同一个位置**。
#    这样抓取点在装置坐标里是一个常量，**不需要像素→毫米标定** ——
#    视觉只负责"这是什么件"（分类/计数），不负责"它在哪"。
#
# 为什么这条能绕开标定：
#    标定要解决的只有两件事 —— ①每像素多少毫米（比例）②机器原点落在画面哪个像素。
#    件固定放一处时，这两件事都不需要：抓取点直接由人来定。
#
# ⚠️ 这不是"猜一个坐标"（项目明令禁止的那种）：
#    猜坐标 = 程序解析失败时自己编一个默认值；
#    这里  = 操作员在配置里显式声明"我们的件就放在这儿"，程序只负责读。
#    区别是【谁做的决定】。读不到这一节时程序仍然 fail-closed（一件都不产出）。
#
# ⚠️ 前提：件**必须每次放在同一个位置**，否则会抓空或抓偏。
#    改动后系统会打印 WARNING 提醒这一点。
#
# 取值依据：原点 = 装置中心。中心对相机视野与机械行程都是最保险的位置。
# 若相机视野偏（用户已确认相机不在正中）导致中心看不见件，把件挪到看得见的地方，
# 然后把这里的值改成那个位置的机器坐标（用 MOVE 命令量）。
x = 0.0
y = -45.0


[TurntablePositions]
# 方案C：3 个固定落点([DropPoints]) × 转盘 2 个位置
center_us = 1500
us_per_90deg = 655
angle_a = 90
angle_b = -90
settle_s = 1.0
index_side = none
index_pin = 17

[TurntableSides]
# 哪个货格在哪一侧。1/2/3 与 4/5/6 是同坐标的镜像（转盘翻 180°）
1 = a
2 = a
3 = a
4 = b
5 = b
6 = b
